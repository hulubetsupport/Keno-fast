<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FAST KENO — Original Graphics Upgrade</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/@fontsource/dseg7-classic@5.2.6/index.css');
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&display=swap');

:root{--bg-dark:#12181c;--bg-surface:#172127;--bg-panel:#1e2a32;--border-panel:#2a3a45;--accent-green:#23784c;--accent-green-bright:#3de089;--accent-cyan:#00e5ff;--accent-gold:#f5b041;--text-muted:#8397a4;--dot-red:#ff4757;--dot-blue:#1e90ff}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;min-height:100vh;background:var(--bg-dark);color:#fff;overflow-x:hidden}
.keno-wrapper{width:100%;min-height:100vh;background:var(--bg-dark);display:flex;flex-direction:column;padding-bottom:30px}
.main-content-limiter{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
header.brand-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg-surface);border-bottom:1px solid var(--border-panel);position:sticky;top:0;z-index:50}
.brand-group{display:flex;align-items:center;gap:10px}
.brand-logo{font-size:18px;font-weight:900;font-style:italic;line-height:1;letter-spacing:-.5px}.brand-logo .keno{color:var(--accent-green-bright)}
.header-pill{background:#0d1317;border:1px solid var(--border-panel);border-radius:16px;display:flex;align-items:center;padding:4px 12px;font-size:12px;gap:8px}
.balance-val{color:#ffe600;font-weight:800}.pill-divider{width:1px;height:12px;background:var(--border-panel)}
.round-id{color:var(--text-muted);font-size:11px;display:flex;align-items:center;gap:3px}
.verified-icon{width:12px;height:12px;fill:var(--accent-green-bright)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:5px}
.icon-btn svg{width:19px;height:19px;fill:currentColor}

/* Radar Arena */
.radar-arena{background:radial-gradient(circle at center,#193539 0%,#111e24 65%,var(--bg-dark) 100%);padding:12px 16px;position:relative;border-bottom:1px solid var(--border-panel);display:flex;flex-direction:column;align-items:center;min-height:175px;justify-content:center;overflow:hidden;width:100%}
.radar-rings-box{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sonar-ring{position:absolute;border-radius:50%;border:1px dashed rgba(0,229,255,.14)}
.r1{width:96px;height:96px}.r2{width:180px;height:180px}.r3{width:270px;height:270px}

/* ROTATING RADAR LINES DURING 20-BALL DRAW */
.radar-arena.drawing .r1{animation:radarSpin 10s linear infinite}
.radar-arena.drawing .r2{animation:radarSpinRev 16s linear infinite}
.radar-arena.drawing .r3{animation:radarSpin 24s linear infinite}

@keyframes radarSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes radarSpinRev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}

.radar-top-row{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:11px;position:absolute;top:8px;padding:0 16px;z-index:3}
.rule-pill{display:flex;align-items:center;gap:4px}
.rule-badge{width:22px;height:22px;border-radius:50%;background:#152026;border:1px solid var(--border-panel);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#cbd5e1}
.rule-badge.blue{background:#007799;color:#fff}
.radar-timer{font-size:19px;font-weight:900;color:var(--accent-cyan);letter-spacing:1.5px;text-shadow:0 0 10px rgba(0,229,255,.4)}
.radar-timer.live{color:#ff4757;animation:blink .8s infinite}

.selection-view{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;z-index:2;margin-top:14px}
.choose-title{font-size:18px;font-weight:800}.choose-sub{font-size:13px;font-weight:700;color:var(--accent-green-bright);margin-top:2px}
.possible-win-view{display:none;width:100%;padding:0 8px}
.possible-win-header{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:4px}
.possible-win-header span{color:var(--accent-green-bright);font-size:15px}
.odds-row{display:flex;gap:12px;font-size:11px;color:var(--text-muted);margin-bottom:6px;flex-wrap:wrap}.odds-row .hl{color:#fff;font-weight:700}
.selected-rack{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;width:100%}.selected-rack::-webkit-scrollbar{display:none}
.rack-slot{min-width:26px;height:26px;border-radius:4px;background:rgba(255,255,255,.05);border:1px dashed var(--border-panel);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.rack-slot.filled{background:var(--bg-panel);border:1px solid var(--border-panel)}

/* 3D Ball Draw View */
.draw-view{display:none;width:100%;flex-direction:column;align-items:center;z-index:2;padding:16px 0 8px}
.big-3d-ball{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#4ba2d4 0%,#174b75 45%,#081d2f 85%,#020c15 100%);box-shadow:0 6px 24px rgba(0,0,0,.8),inset 0 2px 6px rgba(255,255,255,.6),0 0 20px rgba(0,229,255,.35);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;margin-bottom:10px}
.drawn-tray{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:0 6px;max-width:480px}
.mini-ball{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a6894 0%,#163654 60%,#0a1b2b 100%);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 2px rgba(255,255,255,.45);animation:popIn .3s ease}
.mini-ball.hit{background:radial-gradient(circle at 35% 30%,#46e890 0%,#1e8749 60%,#0c4322 100%);font-weight:900;box-shadow:0 0 12px rgba(62,224,137,.85);color:#fff}
.draw-result{min-height:22px;margin-top:8px;font-size:15px;font-weight:800;text-align:center}.res-win{color:var(--accent-green-bright)}.res-lose{color:var(--text-muted)}
.skip-btn{position:absolute;right:14px;bottom:10px;background:rgba(0,0,0,.5);border:1px solid var(--border-panel);color:#cbd5e1;font-size:11px;font-weight:800;padding:5px 12px;border-radius:14px;cursor:pointer;z-index:4;display:none}

.grid-section{padding:8px 12px;width:100%}
.keno-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(3px,1vw,6px);width:100%}
.grid-cell{background:#172127;border:1px solid var(--border-panel);height:clamp(34px,7vw,48px);border-radius:4px;font-size:clamp(12px,2.5vw,15px);font-weight:700;color:#9cb1c1;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .05s,background .1s}
.grid-cell:active{transform:scale(.94)}
.grid-cell.selected{background:var(--accent-green);color:#fff;font-weight:900;border-color:var(--accent-green-bright);box-shadow:inset 0 0 8px rgba(61,224,137,.7)}
.cell-dot{position:absolute;width:5px;height:5px;border-radius:50%;top:3px}
.dot-hot{right:3px;background:var(--dot-red);box-shadow:0 0 4px var(--dot-red)}.dot-cold{left:3px;background:var(--dot-blue);box-shadow:0 0 4px var(--dot-blue)}

.controls-wrapper{padding:0 12px;width:100%}
.bet-stepper{display:flex;align-items:center;background:var(--bg-surface);border:1px solid var(--border-panel);border-radius:4px;margin-bottom:6px;overflow:hidden;width:100%}
.ctrl-step-btn{width:44px;height:40px;background:transparent;border:none;color:var(--text-muted);font-size:19px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctrl-step-btn:active{background:rgba(255,255,255,.05)}
.bet-amt-val{flex:1;text-align:center;font-size:16px;font-weight:800}
.quick-chips{display:flex;border-left:1px solid var(--border-panel)}
.quick-chip{background:var(--bg-panel);border:none;border-right:1px solid var(--border-panel);color:var(--accent-green-bright);font-size:11px;font-weight:800;padding:0 11px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.quick-chip:last-child{border-right:none;color:var(--text-muted)}
.main-bet-btn{width:100%;height:46px;background:linear-gradient(180deg,#24754a 0%,#1b5938 100%);color:#fff;font-size:16px;font-weight:900;letter-spacing:.8px;border:1px solid #3de089;border-radius:4px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.main-bet-btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.main-bet-btn.accepted{background:#17422b;border-color:#27a863}

.tabs-bar{display:flex;background:var(--bg-surface);border-top:1px solid var(--border-panel);border-bottom:1px solid var(--border-panel);margin-top:12px;width:100%}
.tab-item{flex:1;padding:10px 0;text-align:center;font-size:clamp(9px,2.3vw,13px);font-weight:800;color:var(--text-muted);cursor:pointer;text-transform:uppercase;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:3px}
.tab-item.active{color:var(--accent-green-bright);border-bottom-color:var(--accent-green-bright);background:rgba(35,120,76,.15)}
.subview{display:none;padding:10px 12px;width:100%}.subview.active{display:block}
.feed-counts-line{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:8px;padding:0 2px}
.feed-counts-line strong{color:var(--accent-green-bright)}
.ticket-list{display:flex;flex-direction:column;gap:6px;width:100%}
.ticket-row{background:var(--bg-panel);border:1px solid var(--border-panel);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.ticket-row.user-ticket{border-color:var(--accent-green-bright);background:#172a22}
.ticket-user-line{display:flex;justify-content:space-between;font-size:12px;font-weight:bold;color:var(--accent-green-bright)}
.ticket-numbers-grid{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.ticket-numbers-grid::-webkit-scrollbar{display:none}
.ticket-slot{width:28px;height:26px;background:#141c22;border-radius:3px;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ticket-slot.hit{background:var(--accent-green)!important;font-weight:900}
.ticket-bottom-line{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)}
.status-waiting{color:var(--accent-gold);font-weight:bold}
.status-won{color:var(--accent-green-bright);font-weight:900}.status-lost{color:#8899a6}
.empty-note{font-size:12px;color:var(--text-muted);text-align:center;padding:20px}
.note{font-size:11px;color:var(--text-muted);margin:6px 0;line-height:1.4}
.result-row-card{background:var(--bg-panel);border:1px solid var(--border-panel);border-radius:4px;padding:8px 10px;margin-bottom:6px;display:flex;gap:10px}
.res-draw-col{width:90px;border-right:1px solid var(--border-panel);display:flex;flex-direction:column;justify-content:center}
.res-balls-grid{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.res-mini-ball{background:#141d24;text-align:center;border-radius:2px;padding:3px 0;font-size:10px;font-weight:bold;color:#cbd5e1}.result-source-tag{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:#9aa7a2;margin-top:3px}.result-source-tag.preview{color:#f2df4b}.result-source-tag.server{color:#69c99a}.history-round-heading{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 5px;color:#69c99a;font-size:13px;border-bottom:1px solid #33413d;margin:4px 0}.history-ticket{background:#263133;border:1px solid #202a2c;border-radius:7px;padding:6px;margin-bottom:6px}.history-ticket .ticket-numbers-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}.history-ticket .ticket-slot{height:clamp(30px,6vw,48px);font-size:clamp(11px,2.5vw,18px)}.history-ticket .ticket-bottom-line{margin-top:4px}
.stats-scroll-list{max-height:450px;overflow-y:auto;padding-right:4px}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px}
.stat-num{width:22px;text-align:right;color:var(--text-muted);font-weight:bold}
.stat-bar-outer{flex:1;height:6px;background:var(--border-panel);border-radius:3px;overflow:hidden}.stat-bar-fill{height:100%;background:var(--accent-green-bright)}
.stat-count{width:24px;color:var(--text-muted);font-size:10px}
.table-leaders{width:100%;border-collapse:collapse;font-size:12px}
.table-leaders th{text-align:left;color:var(--text-muted);padding:8px 6px;border-bottom:1px solid var(--border-panel)}
.table-leaders td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.03)}
.toast-overlay{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:1000;display:none}
.toast-box{border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.toast-box.error{background:#471919;border:1px solid #732626;color:#ffd8d8}.toast-box.success{background:#143825;border:1px solid #23633e;color:#d2ffe2}
.toast-close{background:transparent;border:none;color:inherit;cursor:pointer;font-size:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:none;align-items:center;justify-content:center;padding:14px}
.modal-container{width:100%;max-width:480px;max-height:85vh;background:var(--bg-surface);border:1px solid var(--border-panel);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border-panel)}
.modal-nav{display:flex;gap:6px}
.modal-nav-btn{background:var(--bg-panel);border:none;color:var(--text-muted);padding:6px 12px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer}
.modal-nav-btn.active{background:var(--accent-green);color:#fff}
.modal-body{padding:14px;overflow:auto;font-size:12px;color:#cbd5e1;line-height:1.5}
.paytable-grid-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:10px;text-align:center}
.paytable-grid-table th,.paytable-grid-table td{border:1px solid var(--border-panel);padding:5px 2px}
.paytable-grid-table th{background:#131f24;color:var(--accent-green-bright)}
@keyframes popIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:.3}}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}


/* === FAST KENO visual upgrade — presentation only; server/API/game rules retained === */
:root{
 --bg-dark:#171d1d;--bg-surface:#191f1f;--bg-panel:#263133;--border-panel:#202a2c;
 --accent-green:#347c55;--accent-green-bright:#69c99a;--accent-cyan:#69c99a;
 --accent-gold:#f2df4b;--text-muted:#8b9997;--dot-red:#ff626b;--dot-blue:#8bdcff;
}
html,body{background:#171d1d;color:#e8eded;font-family:Roboto,"Arial Narrow",Arial,sans-serif}
.keno-wrapper{background:radial-gradient(ellipse at 50% 16%,rgba(36,76,59,.14),transparent 45%),#171d1d;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.main-content-limiter{max-width:820px}
header.brand-bar{min-height:48px;padding:5px 10px;gap:8px;background:linear-gradient(180deg,#080b0a,#121716);border-bottom:1px solid #1e3027;box-shadow:0 4px 14px #0005}
.brand-group{gap:6px}.brand-group>.icon-btn{display:none}
.brand-logo{font-size:clamp(20px,3.6vw,30px);line-height:.78;letter-spacing:-1.1px;text-shadow:0 1px 2px #d5ded9;min-width:65px}
.brand-logo span{display:block}.brand-logo .keno{color:#63c98f;margin-top:3px;text-shadow:0 1px 2px #173d2b}
.header-pill{flex:1;min-width:0;max-width:530px;justify-content:space-between;background:linear-gradient(180deg,#121b16,#111714);border:1px solid #294936;border-radius:28px;padding:6px 10px;gap:8px;box-shadow:inset 0 0 0 1px #1a2d21,0 1px 3px #0005}
.balance-val{font-size:clamp(12px,2.5vw,18px);font-weight:500;color:#e7ca68;white-space:nowrap}
.pill-divider{height:28px;background:#2b4836}.round-id{font-size:clamp(10px,2.2vw,15px);color:#edf1ef;white-space:nowrap}.round-id strong{font-size:inherit}
.verified-icon{width:clamp(17px,3vw,24px);height:clamp(17px,3vw,24px);filter:drop-shadow(0 1px 3px #2d9c70)}
.header-actions{gap:clamp(8px,2.2vw,18px)}.icon-btn{color:#79d5a5;padding:4px}.icon-btn svg{width:clamp(18px,4vw,25px);height:clamp(18px,4vw,25px)}
.radar-arena{min-height:clamp(170px,35vw,285px);padding:18px 10px 12px;background:radial-gradient(ellipse at 50% 58%,rgba(19,88,70,.52) 0%,rgba(17,43,38,.36) 30%,rgba(17,29,29,.94) 70%,#171d1d 100%);border:0;isolation:isolate}
.radar-rings-box{inset:-24%;overflow:hidden}
.radar-arena:not(.drawing) .r1{animation:radarSpin 32s linear infinite}.radar-arena:not(.drawing) .r2{animation:radarSpinRev 43s linear infinite}.radar-arena:not(.drawing) .r3{animation:radarSpin 55s linear infinite}
.sonar-ring{border:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(82,181,135,.22) 0deg 7deg,transparent 7deg 31deg);-webkit-mask:radial-gradient(circle,transparent 0 47%,#000 48% 49%,transparent 50% 59%,#000 60% 61%,transparent 62% 70%,#000 71% 72%,transparent 73%);mask:radial-gradient(circle,transparent 0 47%,#000 48% 49%,transparent 50% 59%,#000 60% 61%,transparent 62% 70%,#000 71% 72%,transparent 73%);opacity:.9}
.r1{width:clamp(130px,34vw,240px);height:clamp(130px,34vw,240px);background:repeating-conic-gradient(from 10deg,rgba(100,204,151,.23) 0deg 5deg,transparent 5deg 38deg)}
.r2{width:clamp(220px,57vw,390px);height:clamp(220px,57vw,390px);background:repeating-conic-gradient(from 20deg,rgba(100,204,151,.17) 0deg 4deg,transparent 4deg 31deg)}
.r3{width:clamp(310px,80vw,550px);height:clamp(310px,80vw,550px);background:repeating-conic-gradient(from 5deg,rgba(100,204,151,.13) 0deg 4deg,transparent 4deg 24deg)}
.radar-arena.drawing .r1{animation:radarSpin 8s linear infinite}.radar-arena.drawing .r2{animation:radarSpinRev 13s linear infinite}.radar-arena.drawing .r3{animation:radarSpin 19s linear infinite}
.radar-top-row{top:6px;padding:0 10px;color:#a8b8b1}.rule-badge{background:#1c2928;border-color:#315143}.rule-badge.blue{background:#244a42;color:#d6fff0}
.radar-timer{color:#dce8e3;text-shadow:0 0 8px #6cc89a;font-family:"Courier New",monospace}
.selection-view{margin-top:12px;gap:10px}.choose-title{font-size:clamp(16px,3vw,22px);color:#dbe4e0}.choose-sub{font-size:clamp(12px,2.2vw,15px);color:#6bc99a}
.possible-win-view{padding:0 4px}.possible-win-header{font-size:clamp(15px,3vw,22px);color:#e2e9e5}.possible-win-header span{font-size:1.1em;color:#63c78f}
.odds-row{font-size:clamp(10px,2vw,14px);gap:8px}.selected-rack{gap:5px}
.rack-slot{min-width:clamp(24px,5vw,36px);height:clamp(24px,5vw,36px);border-radius:50%;background:radial-gradient(circle at 32% 22%,#61717e 0%,#233b4d 40%,#081b2b 80%);border:1px solid #4c6878;box-shadow:inset 0 2px 3px #ffffff40,0 2px 5px #0007;color:#f1f6f6}
.rack-slot.filled{background:radial-gradient(circle at 32% 22%,#526879 0%,#1d3c50 48%,#061725 85%);border:1px solid #5c7787}
.draw-view{padding:18px 0 6px;gap:2px}
.big-3d-ball{position:relative;width:clamp(76px,17vw,112px);height:clamp(76px,17vw,112px);border:2px solid rgba(111,152,169,.4);background:radial-gradient(ellipse at 34% 19%,#657b8d 0%,#29445b 24%,#0d293e 58%,#061522 82%,#02090f 100%);box-shadow:inset 0 3px 7px #ffffff65,inset 0 -8px 13px #0009,0 4px 16px #000b,0 0 20px #4cb88a25;font-size:clamp(30px,7vw,50px);margin:0 0 10px;animation:ballFloat 3s ease-in-out infinite}
.big-3d-ball:before{content:"";position:absolute;left:12%;top:5%;width:76%;height:36%;border-radius:50%;background:linear-gradient(180deg,#b7c8d1a6,#8095a51c);filter:blur(1px);pointer-events:none}

<script>
/**
 * FAST KENO — Production Hybrid Engine
 * 70% Certified Server RNG + Rich Demo Social Proof & Live Dynamic Counter
 */
const API = "https://keno-dash-server.onrender.com";
let INIT_DATA = "", serverBalance = 0, shownBalance = 0, ready = false;
let serverOffsetMs = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, opts = {}) {
  try {
    const r = await fetch(API + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'x-telegram-init-data': INIT_DATA,
        ...(opts.headers || {})
      }
    });
    return await r.json();
  } catch (e) {
    return { success: false, message: 'Connection problem' };
  }
}

const postParent = m => { try { parent.postMessage(m, '*'); } catch (e) {} };

addEventListener('message', e => {
  if (e.source !== parent) return;
  const d = e.data || {};
  if (d.type === 'INIT' && d.initData) {
    INIT_DATA = d.initData;
    ready = true;
    syncServerClock();
    refreshBalance();
    initPaytable();
    syncServerResults();
    loadPublicLeaders();
  }
  if (d.type === 'UPDATE_BALANCE') refreshBalance();
});
postParent({ type: 'GAME_READY' });

// ---------------- 1. Server Clock Sync ----------------
async function syncServerClock() {
  try {
    const d = await api('/api/keno/round/current');
    if (d && d.serverTime) {
      serverOffsetMs = d.serverTime - Date.now();
    }
  } catch (e) {}
}
setInterval(syncServerClock, 30000);

// ---------------- 2. Global Game Timing ----------------
const BET_WINDOW = 60;
const DRAW_WINDOW = 20;
const TOTAL_CYCLE = 80;
const MIN_BET = 2, MAX_BET = 1000, MAX_PICKS = 10;
const MAX_PAYOUT = 30000;

function getGlobalRound() {
  const nowMs = Date.now() + serverOffsetMs;
  const nowSec = Math.floor(nowMs / 1000);
  const roundId = 64105 + Math.floor(nowSec / TOTAL_CYCLE);
  const cycleSec = nowSec % TOTAL_CYCLE;
  const isDrawing = cycleSec >= BET_WINDOW;
  const remainingSec = isDrawing ? (TOTAL_CYCLE - cycleSec) : (BET_WINDOW - cycleSec);
  const roundStartSec = Math.floor(nowSec / TOTAL_CYCLE) * TOTAL_CYCLE;
  const betClosesAtMs = (roundStartSec + BET_WINDOW) * 1000;

  return { roundId, cycleSec, isDrawing, remainingSec, nowMs, betClosesAtMs };
}

// ---------------- 3. Official 70% RTP Paytable ----------------
let paytable = {
  "1": { 1: 3 },
  "2": { 2: 11.5 },
  "3": { 2: 1.5, 3: 36 },
  "4": { 2: 1, 3: 6, 4: 62 },
  "5": { 2: 0.5, 3: 2, 4: 16.5, 5: 233 },
  "6": { 3: 1.5, 4: 8, 5: 49, 6: 814 },
  "7": { 3: 1.5, 4: 3.5, 5: 18.5, 6: 91, 7: 1828 },
  "8": { 4: 3.5, 5: 11.5, 6: 57, 7: 341, 8: 5684 },
  "9": { 4: 2, 5: 5.5, 6: 26, 7: 158, 8: 1056, 9: 10561 },
  "10": { 0: 1, 5: 3.5, 6: 18.5, 7: 98, 8: 490, 9: 3061, 10: 12243 }
};

async function initPaytable() {
  const d = await api('/api/keno/paytable');
  if (d && d.success && d.paytable) {
    paytable = d.paytable;
    updatePossibleWin();
  }
}

// ---------------- 4. State & Controls ----------------
let currentBetAmount = 4, selectedNumbers = new Set();
let isDrawingPhase = false, isRequestInFlight = false, soundEnabled = true;
let myActiveTickets = [], fullHistory = [];
let drawStatsHistory = [];
let hotSet = new Set(), coldSet = new Set();
let drawInProgress = false;

// 🔥 DEMO ማህበራዊ ውሂብ (ለጀማሪዎች ጨዋታውን ሞቅ የሚያደርግ)
let dynamicAllCount = 2364;
let dynamicLiveTickets = [], simTicketSeq = 100;
const PLAYER_NAMES = ["b***h", "d***k", "j***v", "v***w", "s***k", "y***o", "m***e", "t***i", "k***b", "a***m", "09***1", "h***s", "r***l"];
const STAKE_AMOUNTS = [10, 20, 50, 100, 150, 200, 300];

function computeBaseRoundBets(rId) {
  return 1800 + ((rId * 317) % 18000);
}

function createPlayerTicket() {
  simTicketSeq++;
  const name = PLAYER_NAMES[Math.floor(Math.random() * PLAYER_NAMES.length)];
  const pickCount = Math.floor(Math.random() * 4) + 2; // 2 to 5 ቁጥሮች
  const pool = Array.from({ length: 80 }, (_, i) => i + 1).sort(() => Math.random() - .5);
  return {
    id: `sim_${simTicketSeq}`,
    user: name,
    picks: pool.slice(0, pickCount),
    amount: STAKE_AMOUNTS[Math.floor(Math.random() * STAKE_AMOUNTS.length)],
    status: 'Waiting'
  };
}

function initPlayerFeed() {
  dynamicLiveTickets = [
    { id: 'sim_1', user: 'b***h', picks: [80, 69], amount: 50, status: 'Waiting' },
    { id: 'sim_2', user: 'd***k', picks: [26, 47, 69], amount: 100, status: 'Waiting' },
    { id: 'sim_3', user: 'y***o', picks: [13, 26, 39], amount: 150, status: 'Waiting' },
    { id: 'sim_4', user: 'j***v', picks: [21, 55], amount: 20, status: 'Waiting' },
    { id: 'sim_5', user: 'v***w', picks: [3, 14, 25], amount: 100, status: 'Waiting' },
    { id: 'sim_6', user: 'a***m', picks: [7, 18, 42, 60], amount: 200, status: 'Waiting' }
  ];
  renderPlayerFeed();
}

function renderPlayerFeed() {
  const c = $('live-dynamic-tickets-container');
  if (!c) return;
  c.innerHTML = dynamicLiveTickets.map(t => {
    const slots = Array.from({ length: 10 }, (_, i) => {
      const p = t.picks[i];
      return p !== undefined ? `<div class="ticket-slot" id="dslot_${t.id}_${p}">${p}</div>` : '<div class="ticket-slot empty"></div>';
    }).join('');
    return `
      <div class="ticket-row" id="prow_${t.id}">
        <div class="ticket-user-line"><span>${t.user}</span></div>
        <div class="ticket-numbers-grid">${slots}</div>
        <div class="ticket-bottom-line"><span>Bet ${t.amount}</span><span class="status-waiting" id="dstatus_${t.id}">${t.status}</span></div>
      </div>
    `;
  }).join('');
}

async function refreshBalance() {
  const d = await api('/api/user/init');
  if (d && d.success) {
    serverBalance = d.balance;
    if (!isDrawingPhase) {
      shownBalance = d.balance;
      showBalance(false);
    }
    if (Array.isArray(d.myTickets) && d.myTickets.length > 0 && myActiveTickets.length === 0) {
      myActiveTickets = d.myTickets.map((t, idx) => ({
        id: t.id,
        num: idx + 1,
        picks: t.picks,
        amount: t.amount,
        status: t.status === 'PENDING' ? 'Waiting' : t.status,
        payout: t.payout || 0
      }));
      renderActiveUserTickets();
    }
  }
}

function showBalance(post) {
  $('lbl-balance').textContent = Number(shownBalance).toFixed(2);
  if (post) postParent({ type: 'BALANCE_UPDATE', newBalance: serverBalance });
}

// ---------------- 5. Audio Synthesizer ----------------
let audioCtx = null;
function playSynth(freq = 600, duration = .06, type = 'sine') {
  if (!soundEnabled) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx && Ctx) audioCtx = new Ctx();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + duration);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// ---------------- 6. Grid & Picks ----------------
function buildGrid() {
  const g = $('keno-grid'); g.innerHTML = '';
  for (let i = 1; i <= 80; i++) {
    const c = document.createElement('div');
    c.className = 'grid-cell'; c.id = 'cell-' + i; c.textContent = i;
    c.onclick = () => togglePick(i);
    g.appendChild(c);
  }
  updateGridDots();
}

function syncGridSelections() {
  for (let i = 1; i <= 80; i++) {
    const el = $('cell-' + i);
    if (el) el.classList.toggle('selected', selectedNumbers.has(i));
  }
}

function updateGridDots() {
  for (let i = 1; i <= 80; i++) {
    const cell = $('cell-' + i);
    if (!cell) continue;
    const old = cell.querySelector('.cell-dot');
    if (old) old.remove();
    if (hotSet.has(i)) {
      const d = document.createElement('span'); d.className = 'cell-dot dot-hot'; cell.appendChild(d);
    } else if (coldSet.has(i)) {
      const d = document.createElement('span'); d.className = 'cell-dot dot-cold'; cell.appendChild(d);
    }
  }
}

function togglePick(n) {
  if (isDrawingPhase) return;
  playSynth(550, .03);
  if (selectedNumbers.has(n)) selectedNumbers.delete(n);
  else {
    if (selectedNumbers.size >= MAX_PICKS) return showToast('Maximum 10 numbers allowed', 'error');
    selectedNumbers.add(n);
  }
  syncGridSelections();
  updatePossibleWin();
}

function clearPicks() {
  if (isDrawingPhase) return;
  selectedNumbers.clear();
  syncGridSelections();
  updatePossibleWin();
}

function updatePossibleWin() {
  const def = $('default-banner'), win = $('possible-win-view'), count = selectedNumbers.size;
  if (count === 0 || !paytable) { def.style.display = 'block'; win.style.display = 'none'; return; }
  def.style.display = 'none'; win.style.display = 'block';

  const t = paytable[String(count)] || {};
  const mults = Object.values(t);
  const maxM = mults.length ? Math.max(...mults) : 0;
  const calcWin = Math.min(MAX_PAYOUT, Math.round(maxM * currentBetAmount));
  $('lbl-possible-win').textContent = calcWin;

  let match = '<span style="margin-right:6px;">Match</span>', pays = '<span style="margin-right:6px;">Pays</span>';
  const hitKeys = Object.keys(t).map(Number).sort((a,b)=>a-b);
  for (const h of hitKeys) {
    match += `<span class="hl" style="min-width:24px;display:inline-block;text-align:center;">${h}</span>`;
    pays += `<span class="hl" style="min-width:24px;display:inline-block;text-align:center;">x${t[h]}</span>`;
  }
  $('odds-row-container').innerHTML = `<div>${match}</div><div>${pays}</div>`;

  const rack = $('selected-rack'); rack.innerHTML = '';
  const arr = [...selectedNumbers];
  for (let i = 0; i < MAX_PICKS; i++) {
    const s = document.createElement('div'); s.className = 'rack-slot';
    if (arr[i] !== undefined) { s.classList.add('filled'); s.textContent = arr[i]; }
    rack.appendChild(s);
  }
}

function setBet(v) {
  v = Math.round(v * 100) / 100;
  currentBetAmount = Math.min(MAX_BET, Math.max(MIN_BET, v));
  $('lbl-bet-amount').textContent = currentBetAmount.toFixed(2);
  updatePossibleWin();
}
function adjustBet(d) { if (isDrawingPhase) return; playSynth(450, .02); setBet(currentBetAmount + d); }
function multiplyBet(m) { if (isDrawingPhase) return; playSynth(500, .02); setBet(currentBetAmount * m); }
function setMaxBet() { if (isDrawingPhase) return; setBet(Math.min(MAX_BET, Math.floor(serverBalance) || MIN_BET)); }

// ---------------- 7. Secure Bet Placement ----------------
async function placeKenoTicket() {
  if (isDrawingPhase || isRequestInFlight) return;
  if (selectedNumbers.size === 0) return showToast('Choose at least 1 number', 'error');
  if (myActiveTickets.length >= 10) return showToast('Maximum 10 tickets per round', 'error');
  if (serverBalance < currentBetAmount) {
    showToast('Not enough balance for this bet', 'error');
    postParent({ type: 'OPEN_DEPOSIT' });
    return;
  }

  const { roundId, cycleSec } = getGlobalRound();
  if (cycleSec >= BET_WINDOW) {
    return showToast('Betting closed for this round', 'error');
  }

  isRequestInFlight = true;
  const btn = $('btn-bet');
  btn.disabled = true; btn.classList.add('accepted');
  $('btn-bet-label').textContent = 'BET ACCEPTED';
  postParent({ type: 'BET_STARTED' });

  const picks = [...selectedNumbers];
  const amount = currentBetAmount;
  const idempotencyKey = (typeof crypto.randomUUID === 'function') 
    ? crypto.randomUUID() 
    : 'idemp_' + Date.now() + '_' + Math.random().toString(36).substring(2);

  const res = await api('/api/bet/play', {
    method: 'POST',
    body: JSON.stringify({
      gameName: 'KenoFast',
      betAmount: amount,
      clientData: { picks },
      idempotencyKey
    })
  });

  if (!res || !res.success) {
    isRequestInFlight = false;
    btn.disabled = false; btn.classList.remove('accepted');
    $('btn-bet-label').textContent = 'BET';
    postParent({ type: 'BET_ENDED' });
    showToast(res && res.message ? res.message : 'Bet failed', 'error');
    return;
  }

  serverBalance = res.newBalance;
  shownBalance = res.newBalance;
  showBalance(false);

  playSynth(850, .08);

  const tIndex = myActiveTickets.length + 1;
  const ticketObj = {
    id: res.ticketId || `tkt_${Date.now()}`,
    num: tIndex,
    picks: picks,
    amount: amount,
    roundId: roundId,
    status: 'Waiting',
    payout: 0
  };
  myActiveTickets.push(ticketObj);
  renderActiveUserTickets();

  // ቆራጭ ቁጥሩን ወዲያው ያሳድጋል
  dynamicAllCount += Math.floor(Math.random() * 4) + 1;
  $('lbl-all-count').textContent = dynamicAllCount.toLocaleString();

  isRequestInFlight = false;
  btn.disabled = false; btn.classList.remove('accepted');
  $('btn-bet-label').textContent = 'BET';
  clearPicks();
}

function renderActiveUserTickets() {
  const container = $('my-tickets-container');
  container.innerHTML = '';
  $('lbl-my-tickets-count').textContent = myActiveTickets.length;
  const tot = myActiveTickets.reduce((s, t) => s + t.amount, 0);
  $('lbl-my-bets-total').textContent = tot.toFixed(0);

  myActiveTickets.forEach(t => {
    const slots = Array.from({ length: 10 }, (_, i) => {
      const p = t.picks[i];
      return p !== undefined ? `<div class="ticket-slot" id="uslot_${t.id}_${p}">${p}</div>` : '<div class="ticket-slot empty"></div>';
    }).join('');

    const card = document.createElement('div');
    card.className = 'ticket-row user-ticket';
    card.id = 'trow_' + t.id;
    card.innerHTML = `
      <div class="ticket-user-line"><span>#${t.id} (Ticket ${t.num})</span></div>
      <div class="ticket-numbers-grid">${slots}</div>
      <div class="ticket-bottom-line"><span>Bet ${t.amount.toFixed(0)}</span><span class="status-waiting" id="status_${t.id}">${t.status}</span></div>
    `;
    container.appendChild(card);
  });
}

// ---------------- 8. 24/7 Clock Loop & Dynamic Counter ----------------
let lastPhase = 'betting';

setInterval(() => {
  const round = getGlobalRound();
  $('lbl-round-id').textContent = round.roundId;

  if (!round.isDrawing) {
    // BETTING STAGE (0 - 60s)
    isDrawingPhase = false;
    drawInProgress = false;

    $('grid-container-section').style.display = 'block';
    $('controls-section').style.display = 'block';
    $('draw-view').style.display = 'none';
    $('selection-view').style.display = 'flex';
    $('radar-arena').classList.remove('drawing');

    const remSec = round.remainingSec;
    const tEl = $('stage-timer');
    tEl.classList.remove('live');
    tEl.innerHTML = `00<span class="timer-slash">:</span>${remSec < 10 ? '0' : ''}${remSec}`;

    if (lastPhase === 'drawing') {
      lastPhase = 'betting';
      dynamicAllCount = computeBaseRoundBets(round.roundId);
      $('lbl-all-count').textContent = dynamicAllCount.toLocaleString();
      myActiveTickets = [];
      renderActiveUserTickets();
      initPlayerFeed(); // አዳዲስ Demo ተጫዋቾችን ያዘጋጃል
      $('btn-bet').disabled = false;
      refreshBalance();
    }

    // ቆራጭ ቁጥሩ ያለማቋረጥ እንዲጨምር ያደርጋል
    if (remSec % 2 === 0) {
      dynamicAllCount += Math.floor(Math.random() * 55) + 12;
      $('lbl-all-count').textContent = dynamicAllCount.toLocaleString();
      
      // አዳዲስ Demo ተጫዋቾች ወደ ዝርዝሩ እንዲገቡ ያደርጋል
      if (dynamicLiveTickets.length < 12 && Math.random() < 0.65) {
        dynamicLiveTickets.unshift(createPlayerTicket());
        renderPlayerFeed();
      }
    }
  } else {
    // DRAW STAGE (60 - 80s)
    isDrawingPhase = true;
    lastPhase = 'drawing';

    const tEl = $('stage-timer');
    tEl.classList.add('live');

    $('grid-container-section').style.display = 'none';
    $('controls-section').style.display = 'none';
    $('selection-view').style.display = 'none';
    $('draw-view').style.display = 'flex';
    $('radar-arena').classList.add('drawing');

    if (!drawInProgress) {
      drawInProgress = true;
      executeSynchronizedDraw(round);
    }
  }
}, 1000);

// ---------------- 9. Synchronized 20-Ball Sequential Draw ----------------
async function executeSynchronizedDraw(round) {
  const tray = $('drawn-tray'); tray.innerHTML = '';
  const big = $('current-drawn-ball');
  $('draw-result').textContent = 'Waiting for certified draw...';

  let drawn = null;

  // ሰርቨሩ በ 60ኛው ሰከንድ ያወጣውን 20 ኳሶች ይቀበላል
  while (!drawn) {
    const cur = await api('/api/keno/round/current');
    if (cur && Array.isArray(cur.drawnNumbers) && cur.drawnNumbers.length === 20) {
      drawn = cur.drawnNumbers;
      break;
    }
    await new Promise(r => setTimeout(r, 500));
  }

  $('draw-result').textContent = '';

  const elapsedMs = Math.max(0, (Date.now() + serverOffsetMs) - round.betClosesAtMs);
  const startIdx = Math.min(20, Math.floor(elapsedMs / 950));

  // የቀደሙትን ኳሶች በቅጽበት ይጥላል
  for (let i = 0; i < startIdx; i++) {
    const b = drawn[i];
    renderBallToTray(b, i + 1, false);
    highlightUserHits(b);
    highlightDemoHits(b);
  }

  // የቀሩትን ኳሶች በየ 950ms ቀስ እያለ ያወጣል
  for (let i = startIdx; i < 20; i++) {
    const b = drawn[i];
    big.textContent = b;
    big.style.animation = 'none'; void big.offsetWidth;
    big.style.animation = 'popIn .35s cubic-bezier(.175,.885,.32,1.275)';
    $('stage-timer').innerHTML = `${i + 1}<span class="timer-slash">/</span>20`;

    playSynth(700, .04);
    highlightUserHits(b);
    highlightDemoHits(b);
    renderBallToTray(b, i + 1, true);

    await new Promise(r => setTimeout(r, 950));
  }

  await settleRoundAuthoritative(round.roundId, drawn);
}

function renderBallToTray(b, index, animated) {
  const tray = $('drawn-tray');
  const isUserHit = myActiveTickets.some(t => t.picks.includes(b));
  const m = document.createElement('div');
  m.className = 'mini-ball' + (isUserHit ? ' hit' : '');
  m.textContent = b;
  tray.appendChild(m);
}

function highlightUserHits(b) {
  myActiveTickets.forEach(t => {
    if (t.picks.includes(b)) {
      const s = $(`uslot_${t.id}_${b}`);
      if (s) s.classList.add('hit');
    }
  });
}

function highlightDemoHits(b) {
  dynamicLiveTickets.forEach(t => {
    if (t.picks.includes(b)) {
      const ds = $(`dslot_${t.id}_${b}`);
      if (ds) ds.classList.add('hit');
    }
  });
}

// ---------------- 10. Authoritative Settlement + Demo Settle ----------------
async function settleRoundAuthoritative(roundId, drawn) {
  $('stage-timer').classList.remove('live');
  $('stage-timer').textContent = 'DONE';
  $('radar-arena').classList.remove('drawing');

  drawStatsHistory.unshift(drawn);
  if (drawStatsHistory.length > 100) drawStatsHistory.pop();
  updateLiveStatistics();

  let totalWin = 0;

  // 1. እውነተኛውን ተጠቃሚ ከሰርቨር ማረጋገጥ
  try {
    const [ticketsRes, userRes] = await Promise.all([
      api(`/api/user/tickets?round=${roundId}`),
      api('/api/user/init')
    ]);

    if (userRes && userRes.success) {
      serverBalance = userRes.balance;
      shownBalance = userRes.balance;
      showBalance(true);
    }

    if (ticketsRes && ticketsRes.success && ticketsRes.tickets) {
      ticketsRes.tickets.forEach(st => {
        const t = myActiveTickets.find(x => x.id == st.id);
        const payout = Number(st.payout) || 0;
        totalWin += payout;

        if (t) {
          t.status = st.status;
          t.payout = payout;
          const statusEl = $('status_' + t.id);
          if (statusEl) {
            if (payout > 0) {
              statusEl.textContent = `WON +${payout.toFixed(0)} ETB`;
              statusEl.className = 'status-won';
            } else {
              statusEl.textContent = 'Settled';
              statusEl.className = 'status-lost';
            }
          }
        }

        fullHistory.unshift({
          roundId: roundId,
          picks: st.picks,
          amount: st.amount,
          hits: st.hits,
          win: payout,
          status: payout > 0 ? 'WON' : 'LOST',
          time: Date.now()
        });
      });
    }
  } catch (e) {
    console.error('Settlement error:', e);
  }

  // 2. Demo ተጫዋቾች ማሸነፋቸውን ወይም መሸነፋቸውን ማሳየት (Visual Life)
  dynamicLiveTickets.forEach(t => {
    const hits = t.picks.filter(n => drawn.includes(n)).length;
    const tableP = paytable[String(t.picks.length)] || {};
    const win = t.amount * (tableP[hits] || 0);
    const dst = $('dstatus_' + t.id);
    if (win > 0 && dst) {
      dst.textContent = `WON +${win.toFixed(0)} ETB`;
      dst.className = 'status-won';
    } else if (dst) {
      dst.textContent = 'Settled';
      dst.className = 'status-lost';
    }
  });

  if (totalWin > 0) {
    playSynth(880, .25, 'triangle');
    showToast(`WIN +${totalWin.toFixed(0)} ETB`, 'success');
    $('draw-result').innerHTML = `<span class="res-win">WIN +${totalWin.toFixed(0)} ETB</span>`;
  } else if (myActiveTickets.length > 0) {
    $('draw-result').innerHTML = `<span class="res-lose">No win this round</span>`;
  }

  renderHistoryView();
  syncServerResults();
  loadPublicLeaders();
  postParent({ type: 'BET_ENDED' });
}

// ---------------- 11. Statistics ----------------
function updateLiveStatistics() {
  const counts = {}; for (let i = 1; i <= 80; i++) counts[i] = 0;
  drawStatsHistory.forEach(dr => dr.forEach(n => { if (counts[n] !== undefined) counts[n]++; }));

  const sorted = Object.keys(counts).map(Number).sort((a, b) => counts[b] - counts[a]);
  hotSet = new Set(sorted.slice(0, 5));
  coldSet = new Set(sorted.slice(-5));

  const maxC = Math.max(...Object.values(counts), 1);
  const container = $('stats-bars-container');
  if (container) {
    container.innerHTML = sorted.map(num => `
      <div class="stat-row">
        <div class="stat-num">${num}</div>
        <div class="stat-bar-outer"><div class="stat-bar-fill" style="width:${Math.round(counts[num] / maxC * 100)}%;"></div></div>
        <div class="stat-count">${counts[num]}</div>
      </div>
    `).join('');
  }
  updateGridDots();
}

// ---------------- 12. Results Tab & Cryptographic Proof ----------------
async function syncServerResults() {
  try {
    const d = await api('/api/keno/results?limit=50');
    if (!d || !d.success || !d.results) return;

    const c = $('results-container');
    c.innerHTML = '';

    d.results.forEach(row => {
      const card = document.createElement('div');
      card.className = 'result-row-card';
      const timeStr = row.time ? new Date(row.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      
      card.innerHTML = `
        <div class="res-draw-col">
          <div style="font-weight:bold;font-size:11px;color:var(--accent-green-bright);display:flex;align-items:center;gap:3px;">
            <svg class="verified-icon" viewBox="0 0 24 24" aria-label="Verified"><path d="M12 1.4 3.2 4.7v6.1c0 5.5 3.7 9.7 8.8 11.8 5.1-2.1 8.8-6.3 8.8-11.8V4.7L12 1.4Z"/><path d="m7.2 11.9 3.1 3.1 6.7-7" fill="none" stroke="#e9fff3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            #${esc(row.id)}
          </div>
          <div style="font-size:9px;color:var(--text-muted);">${esc(timeStr)}</div>
          <a href="${API}/api/keno/verify/${row.id}" target="_blank" style="font-size:8px;color:var(--accent-cyan);text-decoration:none;margin-top:4px;">
            Verify Proof ↗
          </a>
        </div>
        <div class="res-balls-grid">
          ${row.numbers.map(n => `<div class="res-mini-ball">${n}</div>`).join('')}
        </div>
      `;
      c.appendChild(card);
    });

    drawStatsHistory = d.results.map(r => r.numbers);
    updateLiveStatistics();
  } catch (e) {}
}

function renderHistoryView() {
  const c = $('history-container');
  if (!fullHistory.length) { c.innerHTML = '<div class="empty-note">No betting history found</div>'; return; }
  const groups = new Map();
  fullHistory.forEach(h => {
    const key = String(h.roundId);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(h);
  });
  c.innerHTML = [...groups.entries()].map(([roundId, tickets]) => `
    <div class="history-round-heading"><span>◆ &nbsp;Draw ID: ${esc(roundId)}</span><span>${new Date(Math.max(...tickets.map(t=>Number(t.time)||Date.now()))).toLocaleString([], {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span></div>
    ${tickets.map(h => `
      <div class="history-ticket">
        <div class="ticket-numbers-grid">${Array.from({length:10}, (_,i) => h.picks[i] !== undefined ? `<div class="ticket-slot ${h.status === 'WON' && h.picks[i] ? 'hit' : ''}">${h.picks[i]}</div>` : '<div class="ticket-slot empty"></div>').join('')}</div>
        <div class="ticket-bottom-line"><span>Bet ${Number(h.amount).toFixed(0)}</span><span class="${h.status === 'WON' ? 'status-won' : 'status-lost'}">${h.status === 'WON' ? '+' + Number(h.win).toFixed(0) : '0'} ETB</span></div>
      </div>
    `).join('')}
  `).join('');
}

// ---------------- 13. Mixed Real & Demo Leaders ----------------
async function loadPublicLeaders() {
  const d = await api('/api/public/feed');
  const realWins = (d && d.success && Array.isArray(d.wins)) ? d.wins : [];
  
  // እውነተኛዎቹን ከ Demo አሸናፊዎች ጋር ቀላቅሎ ያሳያል
  const demoFallback = [
    { user: 'b***w', game: 'Keno', win: 30000 },
    { user: 'y***o', game: 'Keno', win: 24500 },
    { user: 'i***s', game: 'Keno', win: 18000 },
    { user: 'w***j', game: 'Keno', win: 12000 },
    { user: 'k***e', game: 'Keno', win: 8500 }
  ];

  const merged = [...realWins, ...demoFallback].slice(0, 10);

  $('leaders-tbody').innerHTML = merged.map((w, i) => `

}

// ---------------- 14. UI Tabs & Modals ----------------
let toastTimeout = null;
function showToast(msg, type = 'error') {
  $('toast-box').className = 'toast-box ' + type;
  $('toast-message').textContent = msg;
  $('toast-overlay').style.display = 'block';
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(hideToast, 3500);
}
function hideToast() { $('toast-overlay').style.display = 'none'; }

function switchTab(id, el) {
  playSynth(600, .02);
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.subview').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
  const v = $('view-' + id);
  if (v) v.classList.add('active');
  if (id === 'leaders') loadPublicLeaders();
  if (id === 'results') syncServerResults();
}

function exitToLobby() {

  postParent({ type: 'EXIT_GAME' });
}

      <p style="margin-bottom:8px;">Bet ${MIN_BET} – ${MAX_BET} ETB. Maximum payout per bet ${MAX_PAYOUT.toLocaleString()} ETB.</p>

    let t = '<table class="paytable-grid-table"><thead><tr><th>Hits</th>' + Array.from({ length: 10 }, (_, i) => `<th>${i + 1}</th>`).join('') + '</tr></thead><tbody>';

      t += `<tr><td style="font-weight:bold;color:#fff">${h}</td>`;

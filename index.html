<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fast Keno - Master Radar Edition</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-black: #05080a;
      --bg-panel: #0d1418;
      --border-dark: #1b262c;
      --accent-green: #00e676;
      --accent-cyan: #00e5ff;
      --accent-gold: #ffb300;
      --btn-green: #00c853;
      --btn-green-hover: #00e676;
      --text-gray: #758a92;
      --text-light: #d1dcde;
      --dot-red: #ff3d00;
      --dot-blue: #00e5ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100vh; background: #000; color: #fff; overflow-x: hidden; }
    
    .keno-wrapper {
      width: 100%; min-height: 100vh; background: var(--bg-black);
      display: flex; flex-direction: column; position: relative; margin: 0 auto; max-width: 480px;
    }

    /* 1. Header Bar */
    .brand-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: #080f12; border-bottom: 1px solid #142024; position: sticky; top: 0; z-index: 40;
    }
    .brand-logo { font-size: 18px; font-weight: 900; font-style: italic; color: #fff; line-height: 1; letter-spacing: -0.5px; }
    .brand-logo span { color: var(--accent-green); display: block; font-size: 13px; margin-top: -2px; }
    
    .brand-center-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .balance-chip-box {
      background: #04080a; border: 1px solid #1c2b32; border-radius: 4px; padding: 4px 8px;
      display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; color: var(--accent-green);
    }
    .id-tag { display: flex; align-items: center; gap: 3px; color: var(--text-gray); font-size: 11px; font-weight: bold; }

    .brand-right-icons { display: flex; align-items: center; gap: 10px; color: var(--accent-green); }
    .icon-btn-top { background: none; border: none; color: inherit; cursor: pointer; display: flex; align-items: center; }
    .btn-deposit-gold {
      background: var(--accent-gold); color: #000; font-weight: 900; font-size: 11px;
      border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer;
    }

    /* 2. Sonar Radar Arena */
    .radar-arena {
      background: radial-gradient(circle at center, #102d29 0%, #061113 70%, #05080a 100%);
      padding: 10px 12px; position: relative; border-bottom: 1px solid var(--border-dark);
      display: flex; flex-direction: column; align-items: center; min-height: 145px; overflow: hidden;
    }
    .sonar-ring {
      position: absolute; width: 220px; height: 220px; border-radius: 50%;
      border: 1px solid rgba(0, 229, 255, 0.08); pointer-events: none; animation: pulseSonar 3s infinite linear;
    }
    .radar-top-row { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 12px; z-index: 2; }
    .rule-pill { display: flex; align-items: center; gap: 3px; }
    .rule-badge { width: 22px; height: 22px; border-radius: 50%; background: #132428; border: 1px solid #203b41; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .rule-badge.blue { background: #007799; color: #fff; }
    .radar-timer { font-size: 22px; font-weight: 900; color: var(--accent-cyan); letter-spacing: 2px; text-shadow: 0 0 12px rgba(0, 229, 255, 0.4); }

    .radar-main-content {
      margin-top: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; z-index: 2;
    }
    .choose-title { font-size: 17px; font-weight: 900; color: #fff; }
    .choose-sub { font-size: 13px; font-weight: 800; color: var(--accent-green); margin-top: 1px; }

    /* Live 3D Ball Draw */
    .live-draw-box { display: none; width: 100%; flex-direction: column; align-items: center; z-index: 2; }
    .big-3d-ball {
      width: 70px; height: 70px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #5ce1e6 0%, #0d47a1 70%, #001e3d 100%);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.5), inset 0 2px 5px rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: #fff;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .drawn-queue { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; justify-content: center; max-width: 340px; }
    .q-ball {
      width: 25px; height: 25px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #29b6f6, #01579b);
      font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      animation: popIn 0.2s ease;
    }
    .q-ball.hit {
      background: radial-gradient(circle at 30% 30%, #69f0ae, #00c853);
      color: #000; font-weight: 900; box-shadow: 0 0 8px #00e676;
    }
    .draw-progress { position: absolute; right: 12px; top: 10px; font-size: 12px; font-weight: bold; color: #fff; z-index: 2; }

    /* 3. 100% Fluid 80 Grid */
    .grid-section { padding: 6px 8px; background: var(--bg-black); width: 100%; }
    .keno-grid {
      display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; width: 100%;
    }
    .grid-cell {
      background: #152024; border: 1px solid #203138; color: #d1dcde;
      height: 38px; border-radius: 4px; font-size: 12px;
      font-weight: 700; display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; user-select: none; transition: transform 0.1s;
    }
    .grid-cell:active { transform: scale(0.93); }
    .grid-cell.selected {
      background: #00897b; color: #fff; border-color: var(--accent-green); box-shadow: inset 0 0 6px rgba(0, 230, 118, 0.8);
    }

    /* Dynamic Odds Preview */
    .odds-preview-bar {
      display: flex; gap: 6px; padding: 4px 10px; background: #081013; border-top: 1px solid #16242a;
      overflow-x: auto; scrollbar-width: none; font-size: 11px; font-weight: bold; color: var(--accent-cyan);
    }
    .odds-preview-bar::-webkit-scrollbar { display: none; }
    .odds-chip { background: #121e23; padding: 2px 8px; border-radius: 4px; border: 1px solid #1c3038; white-space: nowrap; }

    /* 4. Controls */
    .controls-wrapper { padding: 6px 10px; background: #080e11; border-top: 1px solid #16242a; }
    .stepper-row {
      display: flex; align-items: center; justify-content: space-between; background: #04080a;
      border: 1px solid #1c2b32; border-radius: 4px; padding: 2px 6px; margin-bottom: 6px; gap: 4px;
    }
    .ctrl-step-btn { background: none; border: none; color: var(--text-gray); font-size: 18px; font-weight: bold; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .bet-amt-val { font-size: 15px; font-weight: 800; color: #fff; width: 65px; text-align: center; background: transparent; border: none; outline: none; }
    .quick-chip { background: #152227; border: 1px solid #23373f; color: #cbd5e1; font-size: 11px; font-weight: 800; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
    .gear-btn { color: var(--accent-green); font-size: 11px; font-weight: 900; cursor: pointer; padding: 6px 8px; border-radius: 4px; background: #0e1e23; border: 1px solid #193c44; }
    .main-bet-btn {
      width: 100%; background: var(--btn-green); color: #000; font-size: 16px; font-weight: 900;
      border: none; border-radius: 4px; padding: 12px 0; cursor: pointer; text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 200, 83, 0.35); letter-spacing: 0.5px;
    }
    .main-bet-btn.closed { background: #374151; color: #9ca3af; cursor: not-allowed; box-shadow: none; }

    /* 5. Navigation Tabs */
    .tabs-bar { display: flex; background: #091013; border-top: 1px solid #16242a; border-bottom: 1px solid #16242a; }
    .tab-item {
      flex: 1; padding: 9px 0; text-align: center; font-size: 10px; font-weight: 800; color: var(--text-gray);
      cursor: pointer; text-transform: uppercase; border-bottom: 2px solid transparent; display: flex; align-items: center; justify-content: center; gap: 3px;
    }
    .tab-item.active { color: var(--accent-green); border-bottom-color: var(--accent-green); background: #0f1c20; }

    /* Subviews */
    .subview { display: none; padding: 8px 10px; flex: 1; max-height: 400px; overflow-y: auto; }
    .subview.active { display: block; }

    /* Ticket Rows */
    .ticket-row {
      background: #0c1519; border: 1px solid #1a2930; border-radius: 4px; padding: 7px 9px; margin-bottom: 5px;
      display: flex; flex-direction: column; gap: 5px; animation: fadeInTicket 0.3s ease-out;
    }
    .ticket-user-line { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; color: var(--accent-green); }
    .ticket-numbers-grid { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
    .ticket-slot {
      width: 26px; height: 24px; background: #162328; border-radius: 3px; font-size: 10px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
    }
    .ticket-slot.empty { background: #0f181c; }
    .ticket-slot.hit { background: var(--accent-green) !important; color: #000 !important; font-weight: 900; box-shadow: 0 0 6px var(--accent-green); }
    .ticket-bottom-line { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; color: #cbd5e1; }
    .status-waiting { color: var(--accent-gold); }
    .status-won { color: var(--accent-green); font-weight: 900; }
    .status-lost { color: #ff5252; }

    /* Clean Win Banner */
    .clean-win-banner {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #00c853, #00e676); color: #000; font-size: 14px; font-weight: 900;
      padding: 8px 24px; border-radius: 30px; box-shadow: 0 6px 25px rgba(0, 230, 118, 0.6);
      z-index: 9999; display: none; animation: popWin 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pulseSonar { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 80% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes popWin { 0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
    @keyframes fadeInTicket { 0% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="keno-wrapper">
  <!-- Clean Win Banner -->
  <div class="clean-win-banner" id="cleanWinBanner">
    🎉 <span id="winAmountSpan">0.00</span> ETB Won!
  </div>

  <!-- 1. Header Bar -->
  <header class="brand-bar">
    <div class="brand-logo">FAST<span>KENO</span></div>
    
    <div class="brand-center-meta">
      <div class="balance-chip-box">
        <span id="userBalanceText">0.00</span> <span>ETB</span>
      </div>
      <div class="id-tag">
        ID: <b id="drawIdText" style="color:#fff;">8950</b>
      </div>
    </div>

    <div class="brand-right-icons">
      <button class="btn-deposit-gold" onclick="notifyParentToOpenDeposit()">Deposit</button>
    </div>
  </header>

  <!-- 2. Sonar Radar Arena -->
  <div class="radar-arena">
    <div class="sonar-ring"></div>

    <div class="radar-top-row">
      <div class="rule-pill">
        <div class="rule-badge">80</div>
        <div class="rule-badge blue">10</div>
      </div>
      <div class="radar-timer" id="timerDisplay">00:30</div>
      <div style="font-size:11px;color:var(--text-gray);">1-10 PICKS</div>
    </div>

    <div class="radar-main-content" id="radarIdleState">
      <div class="choose-title">Choose 1 to 10 Numbers</div>
      <div class="choose-sub">From 1 to 80</div>
    </div>

    <div class="live-draw-box" id="radarDrawState">
      <div class="draw-progress" id="drawCountText">0 / 20</div>
      <div class="big-3d-ball" id="liveBallNum">?</div>
      <div class="drawn-queue" id="drawnBallsList"></div>
    </div>
  </div>

  <!-- 3. 80 Grid -->
  <div class="grid-section" id="gridSection">
    <div class="keno-grid" id="kenoGrid"></div>
  </div>

  <!-- Dynamic Odds Preview -->
  <div class="odds-preview-bar" id="oddsPreviewBar">
    <div class="odds-chip">Pick numbers to preview payout odds</div>
  </div>

  <!-- 4. Controls -->
  <div class="controls-wrapper" id="controlsSection">
    <div class="stepper-row">
      <button class="ctrl-step-btn" onclick="stepBet(-1)">—</button>
      <input type="number" id="betInput" class="bet-amt-val" value="4.00" step="1" min="1">
      <button class="ctrl-step-btn" onclick="stepBet(1)">+</button>
      <button class="quick-chip" onclick="multiplyBet(2)">X2</button>
      <button class="quick-chip" onclick="setMaxBet()">MAX</button>
      <button class="gear-btn" onclick="autoPick5()">⚡ AUTO 5</button>
      <button class="quick-chip" onclick="clearGridSelection()" style="color:#ff5252;">✕</button>
    </div>
    <button class="main-bet-btn" id="betActionBtn" onclick="placeKenoBet()">BET</button>
  </div>

  <!-- 5. Navigation Tabs -->
  <div class="tabs-bar">
    <div class="tab-item active" onclick="switchTab('game', this)">▶ GAME</div>
    <div class="tab-item" onclick="switchTab('history', this)">↺ HISTORY</div>
  </div>

  <!-- 6. Tab Views -->
  <div class="subview active" id="viewGame">
    <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:bold; margin-bottom:6px;">
      <div>All Bets <span style="color:var(--accent-green);" id="allBetsDynamicCount">351</span></div>
      <div style="color:var(--text-gray);">My Tickets: <span style="color:#fff;" id="myTicketsCount">0</span></div>
    </div>
    <div id="myTicketsList"></div>
  </div>

  <div class="subview" id="viewHistory">
    <div id="historyTicketsList">
      <div style="text-align:center; color:var(--text-gray); font-size:11px; margin-top:20px;">No betting history yet</div>
    </div>
  </div>
</div>

<script>
  // ============================================================================
  // 🚀 FAST KENO - 100% PROVABLY INTEGRATED WITH HULU BET RENDER BACKEND
  // ============================================================================
  const RENDER_BASE_URL = "https://hulubet-server.onrender.com";

  // URL Injection: User ID & Balance from Main Lobby
  const urlParams = new URLSearchParams(window.location.search);
  let USER_ID = urlParams.get('userId') || "589218392";
  let realBalance = parseFloat(urlParams.get('balance')) || 20.00;

  function triggerCleanWinBanner(amount) {
    const banner = document.getElementById("cleanWinBanner");
    document.getElementById("winAmountSpan").innerText = Number(amount).toFixed(2);
    banner.style.display = "block";
    setTimeout(() => { banner.style.display = "none"; }, 3500);
  }

  // Audio Synthesizer
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playSynth(freq, dur) {
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  let currentDrawId = 8950;
  let timerSeconds = 30;
  let isDrawingPhase = false;
  let isBettingClosed = false;
  let currentSelections = [];
  let myActiveTickets = [];
  let fullHistoryLog = [];

  function updateBalanceDisplay() {
    document.getElementById("userBalanceText").innerText = realBalance.toFixed(2);
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "BALANCE_UPDATE", newBalance: realBalance }, "*");
      }
    } catch(e) {}
  }
  updateBalanceDisplay();

  // Handshake with Lobby
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "GAME_READY" }, "*");
  }
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'INIT_BALANCE' || e.data?.type === 'UPDATE_BALANCE') {
      if (e.data.balance !== undefined) { realBalance = parseFloat(e.data.balance); updateBalanceDisplay(); }
      if (e.data.userId) USER_ID = String(e.data.userId);
    }
  });

  function notifyParentToOpenDeposit() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "OPEN_DEPOSIT" }, "*");
    }
  }

  const OFFICIAL_PAYTABLE = {
    1: { 1: 3.5 }, 2: { 1: 1, 2: 10 }, 3: { 2: 2, 3: 50 }, 4: { 2: 1.5, 3: 10, 4: 80 },
    5: { 2: 1, 3: 3, 4: 30, 5: 150 }, 6: { 3: 2, 4: 15, 5: 60, 6: 500 },
    7: { 0: 1, 3: 2, 4: 4, 5: 20, 6: 80, 7: 1000 }, 8: { 0: 1, 4: 5, 5: 15, 6: 50, 7: 200, 8: 2000 },
    9: { 0: 2, 4: 2, 5: 10, 6: 25, 7: 125, 8: 1000, 9: 5000 },
    10: { 0: 2, 5: 5, 6: 30, 7: 100, 8: 300, 9: 2000, 10: 10000 }
  };

  // Build 80 Grid
  const gridEl = document.getElementById("kenoGrid");
  for (let i = 1; i <= 80; i++) {
    const cell = document.createElement("div");
    cell.className = "grid-cell";
    cell.id = `cell-${i}`;
    cell.innerText = i;
    cell.onclick = () => toggleCell(i);
    gridEl.appendChild(cell);
  }

  function toggleCell(num) {
    if (isDrawingPhase || isBettingClosed) return;
    playSynth(800, 0.04);
    const idx = currentSelections.indexOf(num);
    if (idx > -1) currentSelections.splice(idx, 1);
    else {
      if (currentSelections.length >= 10) return;
      currentSelections.push(num);
    }
    document.querySelectorAll(".grid-cell").forEach(el => el.classList.remove("selected"));
    currentSelections.forEach(n => document.getElementById(`cell-${n}`).classList.add("selected"));
    updateOddsPreview();
  }

  function updateOddsPreview() {
    const bar = document.getElementById("oddsPreviewBar");
    const count = currentSelections.length;
    if (count === 0) {
      bar.innerHTML = `<div class="odds-chip">Pick numbers to preview payout odds</div>`;
      return;
    }
    const table = OFFICIAL_PAYTABLE[count];
    if (!table) return;
    bar.innerHTML = Object.keys(table).map(hit => `<div class="odds-chip">${hit} Hits: <b>${table[hit]}x</b></div>`).join('');
  }

  function clearGridSelection() {
    currentSelections = [];
    document.querySelectorAll(".grid-cell").forEach(el => el.classList.remove("selected"));
    updateOddsPreview();
  }

  function autoPick5() {
    if (isDrawingPhase || isBettingClosed) return;
    clearGridSelection();
    playSynth(850, 0.06);
    while (currentSelections.length < 5) {
      let r = Math.floor(Math.random() * 80) + 1;
      if (!currentSelections.includes(r)) currentSelections.push(r);
    }
    currentSelections.forEach(n => document.getElementById(`cell-${n}`).classList.add("selected"));
    updateOddsPreview();
  }

  function stepBet(v) {
    const el = document.getElementById("betInput");
    el.value = Math.max(1, Number(el.value) + v).toFixed(2);
  }
  function multiplyBet(f) {
    const el = document.getElementById("betInput");
    el.value = Math.max(1, Number(el.value) * f).toFixed(2);
  }
  function setMaxBet() {
    const el = document.getElementById("betInput");
    el.value = Math.max(1, realBalance).toFixed(2);
  }

  // -------------------------------------------------------------
  // 💰 BET PLACEMENT VIA SERVER (/api/bet/play)
  // -------------------------------------------------------------
  async function placeKenoBet() {
    if (isDrawingPhase) return;
    if (isBettingClosed) return;
    if (currentSelections.length === 0) return;
    if (myActiveTickets.length >= 10) return;
    
    const amt = Number(document.getElementById("betInput").value);
    if (amt > realBalance) {
      notifyParentToOpenDeposit();
      return;
    }

    playSynth(900, 0.06);

    try {
      // Direct call to Render backend Keno engine
      const res = await fetch(`${RENDER_BASE_URL}/api/bet/play`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          userId: USER_ID,
          gameName: "KenoFast",
          betAmount: amt,
          clientData: { picks: [...currentSelections] }
        })
      });

      const data = await res.json();
      if (data.success) {
        const tIndex = myActiveTickets.length + 1;
        const tObj = {
          id: "TKT-" + tIndex,
          betId: data.betId,
          num: tIndex,
          picks: [...currentSelections],
          amount: amt,
          drawId: currentDrawId,
          serverResult: data,
          status: "Waiting"
        };
        myActiveTickets.push(tObj);

        realBalance = Math.max(0, realBalance - amt);
        updateBalanceDisplay();

        document.getElementById("myTicketsCount").innerText = myActiveTickets.length;

        const slots = Array.from({length: 10}, (_, i) => tObj.picks[i] ? `<div class="ticket-slot" id="slot-${tObj.id}-${tObj.picks[i]}">${tObj.picks[i]}</div>` : `<div class="ticket-slot empty"></div>`).join('');
        document.getElementById("myTicketsList").insertAdjacentHTML('beforeend', `
          <div class="ticket-row" id="card-${tObj.id}">
            <div class="ticket-user-line"><span>Ticket ${tObj.num}</span> <span>ID: ${currentDrawId}</span></div>
            <div class="ticket-numbers-grid">${slots}</div>
            <div class="ticket-bottom-line"><span>Bet ${tObj.amount.toFixed(0)} ETB</span> <span class="status-waiting" id="status-${tObj.id}">Waiting</span></div>
          </div>
        `);
        clearGridSelection();
      }
    } catch(err) {
      console.warn("Keno connection warn:", err);
    }
  }

  // -------------------------------------------------------------
  // ⏱️ TIMER & DRAWING PHASE
  // -------------------------------------------------------------
  setInterval(() => {
    if (!isDrawingPhase) {
      timerSeconds = Math.max(0, timerSeconds - 1);
      document.getElementById("timerDisplay").innerText = `00:${timerSeconds < 10 ? '0' : ''}${timerSeconds}`;

      if (timerSeconds <= 5 && !isBettingClosed) {
        isBettingClosed = true;
        const btn = document.getElementById("betActionBtn");
        btn.classList.add("closed");
        btn.innerText = "BETTING CLOSED";
      }

      if (timerSeconds <= 0) startDrawing();
    }
  }, 1000);

  function startDrawing() {
    isDrawingPhase = true;
    document.getElementById("gridSection").style.display = "none";
    document.getElementById("oddsPreviewBar").style.display = "none";
    document.getElementById("controlsSection").style.display = "none";
    document.getElementById("radarIdleState").style.display = "none";
    document.getElementById("radarDrawState").style.display = "flex";
    document.getElementById("timerDisplay").innerText = "LIVE";
    document.getElementById("drawnBallsList").innerHTML = "";

    // 🎯 USE SERVER'S PROVABLY DRAWN NUMBERS
    let roundBalls = [];
    if (myActiveTickets.length > 0 && myActiveTickets[0].serverResult?.visualOutcome?.drawnNumbers) {
      roundBalls = myActiveTickets[0].serverResult.visualOutcome.drawnNumbers;
    } else {
      while (roundBalls.length < 20) {
        let r = Math.floor(Math.random() * 80) + 1;
        if (!roundBalls.includes(r)) roundBalls.push(r);
      }
    }

    let idx = 0;
    const drawInt = setInterval(() => {
      if (idx < 20) {
        const b = roundBalls[idx];
        playSynth(450, 0.08);
        document.getElementById("liveBallNum").innerText = b;
        document.getElementById("drawCountText").innerText = `${idx + 1} / 20`;

        const isUserHit = myActiveTickets.some(t => t.picks.includes(b));
        document.getElementById("drawnBallsList").insertAdjacentHTML('beforeend', `<div class="q-ball ${isUserHit ? 'hit' : ''}">${b}</div>`);

        myActiveTickets.forEach(t => {
          if (t.picks.includes(b)) {
            const el = document.getElementById(`slot-${t.id}-${b}`);
            if (el) el.classList.add("hit");
          }
        });
        idx++;
      } else {
        clearInterval(drawInt);
        finalizeRound(roundBalls);
      }
    }, 900);
  }

  // -------------------------------------------------------------
  // 🏁 SETTLEMENT & REAL BACKEND PAYOUT REVEAL
  // -------------------------------------------------------------
  function finalizeRound(drawn) {
    let winTotal = 0;

    for (const t of myActiveTickets) {
      const hits = t.picks.filter(n => drawn.includes(n)).length;
      const res = t.serverResult;
      const isWin = res ? res.isWin : false;
      const payout = res ? res.payout : 0;
      const mult = res ? res.multiplier : 0;

      const statusEl = document.getElementById(`status-${t.id}`);

      if (isWin && payout > 0) {
        winTotal += payout;
        if (statusEl) { statusEl.innerText = `WON +${payout.toFixed(2)} ETB (${mult}x)`; statusEl.className = "status-won"; }
      } else if (statusEl) {
        statusEl.innerText = `LOST (${hits} hits)`; statusEl.className = "status-lost";
      }

      if (res && res.newBalance !== undefined) {
        realBalance = res.newBalance;
      }

      fullHistoryLog.unshift({ drawId: t.drawId, picks: t.picks, amount: t.amount, hits: hits, win: payout, status: isWin ? 'WON' : 'LOST' });
    }

    if (winTotal > 0) {
      playSynth(900, 0.25);
      triggerCleanWinBanner(winTotal);
    }

    updateBalanceDisplay();
    renderHistoryView();

    setTimeout(() => {
      currentDrawId++;
      document.getElementById("drawIdText").innerText = currentDrawId;
      document.getElementById("gridSection").style.display = "block";
      document.getElementById("oddsPreviewBar").style.display = "flex";
      document.getElementById("controlsSection").style.display = "block";
      document.getElementById("radarIdleState").style.display = "flex";
      document.getElementById("radarDrawState").style.display = "none";
      document.getElementById("myTicketsList").innerHTML = "";
      document.getElementById("myTicketsCount").innerText = "0";

      const btn = document.getElementById("betActionBtn");
      btn.classList.remove("closed");
      btn.innerText = "BET";

      myActiveTickets = [];
      timerSeconds = 30;
      isDrawingPhase = false;
      isBettingClosed = false;
    }, 4000);
  }

  function renderHistoryView() {
    const list = document.getElementById("historyTicketsList");
    if (!fullHistoryLog.length) return;
    list.innerHTML = fullHistoryLog.slice(0, 10).map(h => `
      <div class="ticket-row">
        <div class="ticket-user-line"><span>Draw ID: ${h.drawId}</span> <span class="${h.status === 'WON' ? 'status-won' : 'status-lost'}">${h.status}</span></div>
        <div class="ticket-numbers-grid">${h.picks.map(p => `<div class="ticket-slot">${p}</div>`).join('')}</div>
        <div class="ticket-bottom-line"><span>Bet: ${h.amount} ETB</span> <span>${h.status === 'WON' ? '+' + h.win.toFixed(2) + ' ETB' : '0.00 ETB'} (${h.hits} hits)</span></div>
      </div>
    `).join('');
  }

  function switchTab(tabId, el) {
    document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".subview").forEach(v => v.classList.remove("active"));
    el.classList.add("active");
    if (tabId === 'game') document.getElementById("viewGame").classList.add("active");
    if (tabId === 'history') document.getElementById("viewHistory").classList.add("active");
  }
</script>
</body>

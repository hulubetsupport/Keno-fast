<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fast Keno - Hulu Bet</title>
<style>
:root{--bg-dark:#12181c;--bg-surface:#172127;--bg-panel:#1e2a32;--border-panel:#2a3a45;--accent-green:#23784c;--accent-green-bright:#3de089;--accent-cyan:#00e5ff;--accent-gold:#f5b041;--text-muted:#8397a4;--dot-red:#ff4757;--dot-blue:#1e90ff}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;min-height:100vh;background:var(--bg-dark);color:#fff;overflow-x:hidden}
.keno-wrapper{width:100%;min-height:100vh;background:var(--bg-dark);display:flex;flex-direction:column;padding-bottom:30px}
.main-content-limiter{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
header.brand-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg-surface);border-bottom:1px solid var(--border-panel);position:sticky;top:0;z-index:50}
.brand-group{display:flex;align-items:center;gap:10px}
.brand-logo{font-size:18px;font-weight:900;font-style:italic;line-height:1;letter-spacing:-.5px}.brand-logo .keno{color:var(--accent-green-bright)}
.header-pill{background:#0d1317;border:1px solid var(--border-panel);border-radius:16px;display:flex;align-items:center;padding:4px 12px;font-size:12px;gap:8px}
.balance-val{color:#ffe600;font-weight:800}.pill-divider{width:1px;height:12px;background:var(--border-panel)}
.round-id{color:var(--text-muted);font-size:11px;display:flex;align-items:center;gap:3px}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:5px}
.icon-btn svg{width:19px;height:19px;fill:currentColor}
.radar-arena{background:radial-gradient(circle at center,#1b2d35 0%,#131d22 65%,var(--bg-dark) 100%);padding:12px 16px;position:relative;border-bottom:1px solid var(--border-panel);display:flex;flex-direction:column;align-items:center;min-height:170px;justify-content:center;overflow:hidden;width:100%}
.sonar-ring{position:absolute;border-radius:50%;border:1px dashed rgba(0,229,255,.12);pointer-events:none}
.r1{width:90px;height:90px}.r2{width:170px;height:170px}.r3{width:260px;height:260px}
.radar-top-row{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:11px;position:absolute;top:8px;padding:0 16px;z-index:3}
.rule-pill{display:flex;align-items:center;gap:4px}
.rule-badge{width:22px;height:22px;border-radius:50%;background:#152026;border:1px solid var(--border-panel);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#cbd5e1}
.rule-badge.blue{background:#007799;color:#fff}
.radar-timer{font-size:19px;font-weight:900;color:var(--accent-cyan);letter-spacing:1.5px;text-shadow:0 0 10px rgba(0,229,255,.4)}
.radar-timer.live{color:#ff4757;animation:blink .8s infinite}
.selection-view{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;z-index:2;margin-top:14px}
.choose-title{font-size:18px;font-weight:800}.choose-sub{font-size:13px;font-weight:700;color:var(--accent-green-bright);margin-top:2px}
.possible-win-view{display:none;width:100%;padding:0 8px}
.possible-win-header{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:4px}
.possible-win-header span{color:var(--accent-green-bright);font-size:15px}
.odds-row{display:flex;gap:10px;font-size:11px;color:var(--text-muted);margin-bottom:6px;flex-wrap:wrap}.odds-row .hl{color:#fff;font-weight:700}
.selected-rack{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;width:100%}.selected-rack::-webkit-scrollbar{display:none}
.rack-slot{min-width:26px;height:26px;border-radius:4px;background:rgba(255,255,255,.05);border:1px dashed var(--border-panel);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.rack-slot.filled{background:var(--bg-panel);border:1px solid var(--border-panel)}
.draw-view{display:none;width:100%;flex-direction:column;align-items:center;z-index:2;padding:20px 0 8px}
.big-3d-ball{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5ce1e6 0%,#0d47a1 65%,#001933 100%);box-shadow:0 4px 20px rgba(0,0,0,.7),inset 0 2px 6px rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;margin-bottom:10px}
.drawn-tray{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:0 6px;max-width:480px}
.mini-ball{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a7bd5 0%,#16365c 65%,#0d1e33 100%);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 2px rgba(255,255,255,.5);animation:popIn .3s ease}
.mini-ball.hit{background:radial-gradient(circle at 35% 30%,#69f0ae 0%,#23784c 70%,#0a2e1b 100%);font-weight:900;box-shadow:0 0 10px var(--accent-green-bright)}
.draw-result{min-height:22px;margin-top:8px;font-size:15px;font-weight:800;text-align:center}.res-win{color:var(--accent-green-bright)}.res-lose{color:var(--text-muted)}
.skip-btn{position:absolute;right:14px;bottom:10px;background:rgba(0,0,0,.45);border:1px solid var(--border-panel);color:#cbd5e1;font-size:11px;font-weight:800;padding:5px 12px;border-radius:14px;cursor:pointer;z-index:4;display:none}
.grid-section{padding:8px 12px;width:100%}
.keno-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(3px,1vw,6px);width:100%}
.grid-cell{background:#172127;border:1px solid var(--border-panel);height:clamp(34px,7vw,48px);border-radius:4px;font-size:clamp(12px,2.5vw,15px);font-weight:700;color:#9cb1c1;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .05s,background .1s}
.grid-cell:active{transform:scale(.94)}
.grid-cell.selected{background:var(--accent-green);color:#fff;font-weight:900;border-color:var(--accent-green-bright);box-shadow:inset 0 0 8px rgba(61,224,137,.7)}
.cell-dot{position:absolute;width:5px;height:5px;border-radius:50%;top:3px}
.dot-hot{right:3px;background:var(--dot-red);box-shadow:0 0 4px var(--dot-red)}.dot-cold{left:3px;background:var(--dot-blue);box-shadow:0 0 4px var(--dot-blue)}
.controls-wrapper{padding:0 12px;width:100%}
.bet-stepper{display:flex;align-items:center;background:var(--bg-surface);border:1px solid var(--border-panel);border-radius:4px;margin-bottom:6px;overflow:hidden;width:100%}
.ctrl-step-btn{width:44px;height:40px;background:transparent;border:none;color:var(--text-muted);font-size:19px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bet-amt-val{flex:1;text-align:center;font-size:16px;font-weight:800}
.quick-chips{display:flex;border-left:1px solid var(--border-panel)}
.quick-chip{background:var(--bg-panel);border:none;border-right:1px solid var(--border-panel);color:var(--accent-green-bright);font-size:11px;font-weight:800;padding:0 11px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.quick-chip:last-child{border-right:none;color:var(--text-muted)}
.main-bet-btn{width:100%;height:46px;background:linear-gradient(180deg,#24754a 0%,#1b5938 100%);color:#fff;font-size:16px;font-weight:900;letter-spacing:.8px;border:1px solid #3de089;border-radius:4px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.main-bet-btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.main-bet-btn.accepted{background:#17422b;border-color:#27a863}
.tabs-bar{display:flex;background:var(--bg-surface);border-top:1px solid var(--border-panel);border-bottom:1px solid var(--border-panel);margin-top:12px;width:100%}
.tab-item{flex:1;padding:10px 0;text-align:center;font-size:10px;font-weight:800;color:var(--text-muted);cursor:pointer;text-transform:uppercase;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:3px}
.tab-item.active{color:var(--accent-green-bright);border-bottom-color:var(--accent-green-bright);background:rgba(35,120,76,.15)}
.subview{display:none;padding:10px 12px;width:100%}.subview.active{display:block}
.feed-counts-line{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:8px;padding:0 2px}
.feed-counts-line strong{color:var(--accent-green-bright)}
.ticket-list{display:flex;flex-direction:column;gap:6px;width:100%}
.ticket-row{background:var(--bg-panel);border:1px solid var(--border-panel);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.ticket-row.user-ticket{border-color:var(--accent-green-bright);background:#172a22}
.ticket-user-line{display:flex;justify-content:space-between;font-size:12px;font-weight:bold;color:var(--accent-green-bright)}
.ticket-numbers-grid{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.ticket-numbers-grid::-webkit-scrollbar{display:none}
.ticket-slot{width:28px;height:26px;background:#141c22;border-radius:3px;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ticket-slot.hit{background:var(--accent-green)!important;font-weight:900}
.ticket-bottom-line{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)}
.status-waiting{color:var(--accent-gold);font-weight:bold}
.status-won{color:var(--accent-green-bright);font-weight:900}.status-lost{color:#8899a6}
.empty-note{font-size:12px;color:var(--text-muted);text-align:center;padding:20px}
.note{font-size:11px;color:var(--text-muted);margin:6px 0;line-height:1.4}
.result-row-card{background:var(--bg-panel);border:1px solid var(--border-panel);border-radius:4px;padding:8px 10px;margin-bottom:6px;display:flex;gap:10px}
.res-draw-col{width:90px;border-right:1px solid var(--border-panel);display:flex;flex-direction:column;justify-content:center}
.res-balls-grid{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.res-mini-ball{background:#141d24;text-align:center;border-radius:2px;padding:3px 0;font-size:10px;font-weight:bold;color:#cbd5e1}
.stats-scroll-list{max-height:450px;overflow-y:auto;padding-right:4px}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px}
.stat-num{width:22px;text-align:right;color:var(--text-muted);font-weight:bold}
.stat-bar-outer{flex:1;height:6px;background:var(--border-panel);border-radius:3px;overflow:hidden}.stat-bar-fill{height:100%;background:var(--accent-green-bright)}
.stat-count{width:24px;color:var(--text-muted);font-size:10px}
.table-leaders{width:100%;border-collapse:collapse;font-size:12px}
.table-leaders th{text-align:left;color:var(--text-muted);padding:8px 6px;border-bottom:1px solid var(--border-panel)}
.table-leaders td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.03)}
.toast-overlay{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:1000;display:none}
.toast-box{border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.toast-box.error{background:#471919;border:1px solid #732626;color:#ffd8d8}.toast-box.success{background:#143825;border:1px solid #23633e;color:#d2ffe2}
.toast-close{background:transparent;border:none;color:inherit;cursor:pointer;font-size:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:none;align-items:center;justify-content:center;padding:14px}
.modal-container{width:100%;max-width:480px;max-height:85vh;background:var(--bg-surface);border:1px solid var(--border-panel);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border-panel)}
.modal-nav{display:flex;gap:6px}
.modal-nav-btn{background:var(--bg-panel);border:none;color:var(--text-muted);padding:6px 12px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer}
.modal-nav-btn.active{background:var(--accent-green);color:#fff}
.modal-body{padding:14px;overflow:auto;font-size:12px;color:#cbd5e1;line-height:1.5}
.paytable-grid-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:10px;text-align:center}
.paytable-grid-table th,.paytable-grid-table td{border:1px solid var(--border-panel);padding:5px 2px}
.paytable-grid-table th{background:#131f24;color:var(--accent-green-bright)}
@keyframes popIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:.3}}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
</style>
</head>
<body>
<div class="keno-wrapper">
  <div class="toast-overlay" id="toast-overlay"><div class="toast-box" id="toast-box"><span id="toast-message"></span><button class="toast-close" onclick="hideToast()"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>

  <header class="brand-bar">
    <div class="brand-group">
      <button class="icon-btn" onclick="exitToLobby()" title="Back to Lobby"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="brand-logo"><span>FAST</span><span class="keno">KENO</span></div>
    </div>
    <div class="header-pill">
      <span class="balance-val"><span id="lbl-balance">0.00</span> ETB</span>
      <div class="pill-divider"></div>
      <span class="round-id"><span>ID:</span><strong id="lbl-round-id" style="color:#fff;">45556</strong></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openRulesModal()" title="Rules & Paytable"><svg viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg></button>
      <button class="icon-btn" onclick="toggleAudio()" id="btn-sound" style="color:#ff4757"><svg class="ic" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg></button>
    </div>
  </header>

  <div class="main-content-limiter">
    <section class="radar-arena">
      <div class="sonar-ring r1"></div><div class="sonar-ring r2"></div><div class="sonar-ring r3"></div>
      <div class="radar-top-row">
        <div class="rule-pill"><div class="rule-badge">80</div><div class="rule-badge blue">10</div></div>
        <div class="radar-timer" id="stage-timer">00:60</div>
        <div class="rule-pill" style="cursor:pointer;" onclick="openRulesModal()">?</div>
      </div>
      <div class="selection-view" id="selection-view">
        <div id="default-banner" style="text-align:center;"><div class="choose-title">Choose 10 numbers</div><div class="choose-sub">From 1 to 80</div></div>
        <div class="possible-win-view" id="possible-win-view">
          <div class="possible-win-header">Possible win <span id="lbl-possible-win">0</span> ETB</div>
          <div class="odds-row" id="odds-row-container"></div>
          <div class="selected-rack" id="selected-rack"></div>
        </div>
      </div>
      <div class="draw-view" id="draw-view">
        <div class="big-3d-ball" id="current-drawn-ball">?</div>
        <div class="drawn-tray" id="drawn-tray"></div>
        <div class="draw-result" id="draw-result"></div>
      </div>
      <button class="skip-btn" id="skip-btn" onclick="skipDraw()">SKIP &gt;&gt;</button>
    </section>

    <section class="grid-section" id="grid-container-section"><div class="keno-grid" id="keno-grid"></div></section>

    <section class="controls-wrapper" id="controls-section">
      <div class="bet-stepper">
        <button class="ctrl-step-btn" onclick="adjustBet(-1)">−</button>
        <div class="bet-amt-val" id="lbl-bet-amount">4.00</div>
        <button class="ctrl-step-btn" onclick="adjustBet(1)">+</button>
        <div class="quick-chips">
          <button class="quick-chip" onclick="multiplyBet(2)">X2</button>
          <button class="quick-chip" onclick="setMaxBet()">MAX</button>
          <button class="quick-chip" onclick="autoPick(5)" title="Auto pick 5"><svg class="ic" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button>
          <button class="quick-chip" onclick="clearPicks()" title="Clear"><svg class="ic" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
        </div>
      </div>
      <button class="main-bet-btn" id="btn-bet" onclick="placeKenoTicket()"><span id="btn-bet-label">BET</span></button>
    </section>

    <nav class="tabs-bar">
      <div class="tab-item active" onclick="switchTab('game',this)"><svg class="ic" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>GAME</span></div>
      <div class="tab-item" onclick="switchTab('history',this)"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>HISTORY</span></div>
      <div class="tab-item" onclick="switchTab('results',this)"><svg class="ic" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>RESULTS</span></div>
      <div class="tab-item" onclick="switchTab('statistics',this)"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>STATS</span></div>
      <div class="tab-item" onclick="switchTab('leaders',this)"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg><span>BIG WINS</span></div>
    </nav>

    <section class="subview active" id="view-game">
      <div class="feed-counts-line">
        <span>All <strong id="lbl-all-count">1,240</strong></span>
        <span>My Tickets <strong id="lbl-my-tickets-count">0</strong>/10</span>
        <span>My Bets <strong id="lbl-my-bets-total">0</strong> ETB</span>
      </div>
      <div class="ticket-list" id="my-tickets-container"></div>
      <div class="ticket-list" id="live-dynamic-tickets-container" style="margin-top:6px;"></div>
    </section>

    <section class="subview" id="view-history"><div class="ticket-list" id="history-container"></div></section>
    <section class="subview" id="view-results"><div class="ticket-list" id="results-container"></div></section>
    <section class="subview" id="view-statistics">
      <div class="note" id="stats-label">Live number frequency calculated from rolling draw history.</div>
      <div class="stats-scroll-list" id="stats-bars-container"></div>
    </section>
    <section class="subview" id="view-leaders">
      <table class="table-leaders"><thead><tr><th>#</th><th>Player</th><th>Game</th><th>Win</th></tr></thead><tbody id="leaders-tbody"></tbody></table>
    </section>
  </div>
</div>

<div class="modal-overlay" id="rules-modal">
  <div class="modal-container">
    <div class="modal-header">
      <div class="modal-nav">
        <button class="modal-nav-btn active" id="modal-nav-rules" onclick="switchModalTab('rules')">RULES</button>
        <button class="modal-nav-btn" id="modal-nav-paytable" onclick="switchModalTab('paytable')">PAYTABLE</button>
      </div>
      <button class="icon-btn" onclick="closeRulesModal()"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="modal-content"></div>
  </div>
</div>

<script>
/**
 * FAST KENO (24/7 Global Cycle + Authoritative Hulu Bet Server Integration)
 */
const API = "https://hulubet-server.onrender.com";
let INIT_DATA = "", serverBalance = 0, shownBalance = 0, ready = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, opts = {}) {
  try {
    const r = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-telegram-init-data': INIT_DATA } });
    return await r.json();
  } catch (e) { return { success: false, message: 'Connection problem' }; }
}
const postParent = m => { try { parent.postMessage(m, '*'); } catch (e) {} };

addEventListener('message', e => {
  if (e.source !== parent) return;
  const d = e.data || {};
  if (d.type === 'INIT' && d.initData) { INIT_DATA = d.initData; ready = true; refreshBalance(); initPaytable(); }
  if (d.type === 'UPDATE_BALANCE') refreshBalance();
});
postParent({ type: 'GAME_READY' });

async function refreshBalance() {
  const d = await api('/api/user/init');
  if (d && d.success && !isDrawingPhase) {
    serverBalance = d.balance;
    shownBalance = d.balance;
    showBalance(false);
  }
}
function showBalance(post) {
  $('lbl-balance').textContent = Number(shownBalance).toFixed(2);
  if (post) postParent({ type: 'BALANCE_UPDATE', newBalance: serverBalance });
}

// ---------------- 24/7 Round & Bet Configurations ----------------
const BET_WINDOW = 60;      // 60 seconds betting
const DRAW_WINDOW = 20;     // 20 seconds live draw
const TOTAL_CYCLE = 80;     // 80 seconds round duration
const MIN_BET = 1, MAX_BET = 1000, MAX_PICKS = 10, MAX_PAYOUT = 20000;

let currentBetAmount = 4, selectedNumbers = new Set();
let isDrawingPhase = false, isRequestInFlight = false, soundEnabled = false, skipRequested = false;
let myActiveTickets = [], fullHistory = [];
let dynamicLiveTickets = [], simTicketSeq = 100;
let dynamicAllCount = 1240;

// Rolling draw history for live statistics
let drawStatsHistory = [];
let hotSet = new Set(), coldSet = new Set();

const PLAYER_NAMES = ["d***a", "s***k", "y***o", "b***w", "m***e", "t***i", "k***b", "a***m", "09***1", "h***7", "w***j", "9***x"];
const STAKE_AMOUNTS = [20, 50, 100, 200, 300, 500];

let paytable = {
  "1": [0, 3.5], "2": [0, 1, 10], "3": [0, 0, 2, 50], "4": [0, 0, 1.5, 10, 80],
  "5": [0, 0, 1, 3, 30, 150], "6": [0, 0, 0, 2, 15, 60, 500], "7": [0, 1, 0, 2, 4, 20, 80, 1000],
  "8": [0, 1, 0, 0, 5, 15, 50, 200, 2000], "9": [0, 2, 0, 0, 2, 10, 25, 125, 1000, 5000],
  "10": [0, 2, 0, 0, 0, 5, 30, 100, 300, 2000, 10000]
};

// ---------------- 24/7 Clock Determination ----------------
function getGlobalRound() {
  const nowSec = Math.floor(Date.now() / 1000);
  const roundId = 45556 + Math.floor(nowSec / TOTAL_CYCLE);
  const cycleSec = nowSec % TOTAL_CYCLE;
  return { roundId, cycleSec };
}

// Generates dynamic count scaling realistically from 1,000 up to 34,000
function computeBaseRoundBets(rId) {
  return 1200 + ((rId * 317) % 32800);
}

// ---------------- Audio Synthesizer ----------------
let audioCtx = null;
function playSynth(freq = 600, duration = .06, type = 'sine') {
  if (!soundEnabled) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx && Ctx) audioCtx = new Ctx();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + duration);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}
function toggleAudio() {
  soundEnabled = !soundEnabled;
  const b = $('btn-sound');
  b.innerHTML = soundEnabled ? '<svg class="ic" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>' : '<svg class="ic" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
  b.style.color = soundEnabled ? 'var(--accent-green-bright)' : '#ff4757';
}

// ---------------- Grid & Picks ----------------
function buildGrid() {
  const g = $('keno-grid'); g.innerHTML = '';
  for (let i = 1; i <= 80; i++) {
    const c = document.createElement('div');
    c.className = 'grid-cell'; c.id = 'cell-' + i; c.textContent = i;
    c.onclick = () => togglePick(i);
    g.appendChild(c);
  }
  updateGridDots();
}

function syncGridSelections() {
  for (let i = 1; i <= 80; i++) {
    const el = $('cell-' + i);
    if (el) el.classList.toggle('selected', selectedNumbers.has(i));
  }
}

function updateGridDots() {
  for (let i = 1; i <= 80; i++) {
    const cell = $('cell-' + i);
    if (!cell) continue;
    const old = cell.querySelector('.cell-dot');
    if (old) old.remove();
    if (hotSet.has(i)) {
      const d = document.createElement('span'); d.className = 'cell-dot dot-hot'; cell.appendChild(d);
    } else if (coldSet.has(i)) {
      const d = document.createElement('span'); d.className = 'cell-dot dot-cold'; cell.appendChild(d);
    }
  }
}

function togglePick(n) {
  if (isDrawingPhase) return;
  playSynth(550, .03);
  if (selectedNumbers.has(n)) selectedNumbers.delete(n);
  else {
    if (selectedNumbers.size >= MAX_PICKS) return showToast('Maximum 10 numbers allowed', 'error');
    selectedNumbers.add(n);
  }
  syncGridSelections();
  updatePossibleWin();
}

function clearPicks() {
  if (isDrawingPhase) return;
  selectedNumbers.clear();
  syncGridSelections();
  updatePossibleWin();
}

function autoPick(count = 5) {
  if (isDrawingPhase) return;
  clearPicks(); playSynth(750, .05);
  const pool = Array.from({ length: 80 }, (_, i) => i + 1).sort(() => Math.random() - .5);
  pool.slice(0, count).forEach(n => selectedNumbers.add(n));
  syncGridSelections();
  updatePossibleWin();
}

function updatePossibleWin() {
  const def = $('default-banner'), win = $('possible-win-view'), count = selectedNumbers.size;
  if (count === 0 || !paytable) { def.style.display = 'block'; win.style.display = 'none'; return; }
  def.style.display = 'none'; win.style.display = 'block';
  const t = paytable[String(count)] || [], maxM = t.length ? t[t.length - 1] : 0;
  $('lbl-possible-win').textContent = Math.min(MAX_PAYOUT, maxM * currentBetAmount).toFixed(0);

  let match = '<span style="margin-right:4px;">Match</span>', pays = '<span style="margin-right:4px;">Pays</span>';
  for (let h = 1; h <= count; h++) {
    if ((t[h] || 0) > 0) { match += `<span class="hl"> ${h} </span>`; pays += `<span class="hl"> x${t[h]} </span>`; }
  }
  $('odds-row-container').innerHTML = `<div>${match}</div><div>${pays}</div>`;
  const rack = $('selected-rack'); rack.innerHTML = '';
  const arr = [...selectedNumbers].sort((a, b) => a - b);
  for (let i = 0; i < MAX_PICKS; i++) {
    const s = document.createElement('div'); s.className = 'rack-slot';
    if (arr[i] !== undefined) { s.classList.add('filled'); s.textContent = arr[i]; }
    rack.appendChild(s);
  }
}

// ---------------- Bet Input Controls ----------------
function setBet(v) {

  $('lbl-bet-amount').textContent = currentBetAmount.toFixed(2);
  updatePossibleWin();
}
function adjustBet(d) { if (isDrawingPhase) return; playSynth(450, .02); setBet(currentBetAmount + d); }
function multiplyBet(m) { if (isDrawingPhase) return; playSynth(500, .02); setBet(currentBetAmount * m); }
function setMaxBet() { if (isDrawingPhase) return; setBet(Math.min(MAX_BET, Math.floor(serverBalance) || MIN_BET)); }

// ---------------- Place a Ticket (Authoritative Server Endpoint) ----------------
async function placeKenoTicket() {
  if (isDrawingPhase || isRequestInFlight) return;
  if (selectedNumbers.size === 0) return showToast('Choose at least 1 number', 'error');
  if (myActiveTickets.length >= 10) return showToast('Maximum 10 tickets per round', 'error');
  if (serverBalance < currentBetAmount) {
    showToast('Not enough balance for this bet', 'error');
    postParent({ type: 'OPEN_DEPOSIT' });
    return;
  }

  isRequestInFlight = true;
  const btn = $('btn-bet');
  btn.disabled = true; btn.classList.add('accepted');
  $('btn-bet-label').textContent = 'BET ACCEPTED';
  postParent({ type: 'BET_STARTED' });

  const { roundId } = getGlobalRound();
  const picks = [...selectedNumbers].sort((a, b) => a - b);
  const amount = currentBetAmount;

  const res = await api('/api/bet/play', {
    method: 'POST',
    body: JSON.stringify({ gameName: 'KenoFast', betAmount: amount, clientData: { picks } })
  });

  if (!res || !res.success) {
    isRequestInFlight = false;
    btn.disabled = false; btn.classList.remove('accepted');
    $('btn-bet-label').textContent = 'BET';
    postParent({ type: 'BET_ENDED' });
    showToast(res && res.message ? res.message : 'Bet failed', 'error');
    return;
  }

  // PREVENT PREMATURE SPOILER: Deduct wager only in UI; win payout reveals only after draw!
  serverBalance = res.newBalance;
  shownBalance -= amount;
  showBalance(false);

  playSynth(850, .08);

  const tIndex = myActiveTickets.length + 1;
  const ticketObj = {
    id: `usertkt_${Date.now()}_${tIndex}`,
    num: tIndex,
    picks: picks,
    amount: amount,
    roundId: roundId,
    status: 'Waiting',
    serverRes: res
  };
  myActiveTickets.push(ticketObj);
  renderActiveUserTickets();

  // Dynamic counter increment
  dynamicAllCount += Math.floor(Math.random() * 5) + 1;
  $('lbl-all-count').textContent = dynamicAllCount.toLocaleString();

  isRequestInFlight = false;
  btn.disabled = false; btn.classList.remove('accepted');
  $('btn-bet-label').textContent = 'BET';
  clearPicks();
}

function renderActiveUserTickets() {
  const container = $('my-tickets-container');
  container.innerHTML = '';
  $('lbl-my-tickets-count').textContent = myActiveTickets.length;
  const tot = myActiveTickets.reduce((s, t) => s + t.amount, 0);
  $('lbl-my-bets-total').textContent = tot.toFixed(0);

  myActiveTickets.forEach(t => {
    const slots = Array.from({ length: 10 }, (_, i) => {
      const p = t.picks[i];
      return p !== undefined ? `<div class="ticket-slot" id="uslot_${t.id}_${p}">${p}</div>` : '<div class="ticket-slot empty"></div>';
    }).join('');

    const card = document.createElement('div');
    card.className = 'ticket-row user-ticket';
    card.id = 'trow_' + t.id;
    card.innerHTML = `
      <div class="ticket-user-line"><span>My Ticket ${t.num}</span></div>
      <div class="ticket-numbers-grid">${slots}</div>
      <div class="ticket-bottom-line"><span>Bet ${t.amount.toFixed(0)} ETB</span><span class="status-waiting" id="status_${t.id}">${t.status}</span></div>
    `;
    container.appendChild(card);
  });
}

// ---------------- 24/7 Global Clock Loop ----------------
let lastPhase = 'betting';
let drawInProgress = false;

setInterval(() => {
  const { roundId, cycleSec } = getGlobalRound();
  $('lbl-round-id').textContent = roundId;

  if (cycleSec < BET_WINDOW) {
    // ---------------- BETTING PHASE (00:60 -> 00:00) ----------------
    isDrawingPhase = false;
    drawInProgress = false;

    $('grid-container-section').style.display = 'block';
    $('controls-section').style.display = 'block';
    $('draw-view').style.display = 'none';
    $('selection-view').style.display = 'flex';
    $('skip-btn').style.display = 'none';

    const remSec = BET_WINDOW - cycleSec;
    const tEl = $('stage-timer');
    tEl.classList.remove('live');
    tEl.textContent = `00:${remSec < 10 ? '0' : ''}${remSec}`;

    if (lastPhase === 'drawing') {
      lastPhase = 'betting';
      dynamicAllCount = computeBaseRoundBets(roundId);
      $('lbl-all-count').textContent = dynamicAllCount.toLocaleString();
      myActiveTickets = [];
      renderActiveUserTickets();
      initPlayerFeed();
      $('btn-bet').disabled = false;
    }

    // Dynamic count climbs smoothly towards high range
    if (remSec % 2 === 0) {
      dynamicAllCount += Math.floor(Math.random() * 85) + 12;
      $('lbl-all-count').textContent = dynamicAllCount.toLocaleString();
      if (dynamicLiveTickets.length < 8 && Math.random() < 0.6) {
        dynamicLiveTickets.unshift(createPlayerTicket());
        renderPlayerFeed();
      }
    }
  } else {
    // ---------------- 20-BALL DRAW PHASE ----------------
    isDrawingPhase = true;
    lastPhase = 'drawing';

    const tEl = $('stage-timer');
    tEl.classList.add('live');

    $('grid-container-section').style.display = 'none';
    $('controls-section').style.display = 'none';
    $('selection-view').style.display = 'none';
    $('draw-view').style.display = 'flex';
    $('skip-btn').style.display = 'block';

    if (!drawInProgress) {
      drawInProgress = true;
      run20BallDraw(roundId);
    }
  }
}, 1000);

// ---------------- 20-Ball Draw (Slower Pace ~700ms + Skip Support) ----------------
function run20BallDraw(roundId) {
  try {
    const tray = $('drawn-tray'); tray.innerHTML = '';
    const big = $('current-drawn-ball');
    $('draw-result').textContent = '';
    skipRequested = false;

    // Use authoritative server drawn numbers if tickets exist, else fair random draw
    let drawn = [];
    if (myActiveTickets.length > 0 && myActiveTickets[0].serverRes && myActiveTickets[0].serverRes.visualOutcome) {
      drawn = myActiveTickets[0].serverRes.visualOutcome.drawnNumbers || [];
    }
    if (!Array.isArray(drawn) || drawn.length !== 20) {
      const pool = Array.from({ length: 80 }, (_, i) => i + 1).sort(() => Math.random() - .5);
      drawn = pool.slice(0, 20);
    }

    let idx = 0;

    function step() {
      if (idx >= 20) {
        settleRound(roundId, drawn);
        return;
      }

      const b = drawn[idx];
      big.textContent = b;
      big.style.animation = 'none'; void big.offsetWidth;
      big.style.animation = 'popIn .3s cubic-bezier(.175,.885,.32,1.275)';

      playSynth(300 + (idx * 20), .07);
      $('stage-timer').textContent = `${idx + 1} / 20`;

      // Highlight hits
      myActiveTickets.forEach(t => {
        if (t.picks.includes(b)) {
          const s = $(`uslot_${t.id}_${b}`);
          if (s) s.classList.add('hit');
        }
      });
      dynamicLiveTickets.forEach(t => {
        if (t.picks.includes(b)) {
          const ds = $(`dslot_${t.id}_${b}`);
          if (ds) ds.classList.add('hit');
        }
      });

      const isUserHit = myActiveTickets.some(t => t.picks.includes(b));
      const m = document.createElement('div');
      m.className = 'mini-ball' + (isUserHit ? ' hit' : '');
      m.textContent = b;
      tray.appendChild(m);

      idx++;
      // Slower, thrilling draw tempo (700ms) or instantaneous on Skip
      setTimeout(step, skipRequested ? 0 : 700);
    }

    step();
  } catch (e) {
    console.error("Draw loop error:", e);
  }
}
function skipDraw() { skipRequested = true; }

// ---------------- Settle Round & Reveal Authoritative Balance ----------------
function settleRound(roundId, drawn) {
  $('skip-btn').style.display = 'none';
  $('stage-timer').classList.remove('live');
  $('stage-timer').textContent = 'DONE';

  let totalWin = 0;

  // Add to draw statistics
  drawStatsHistory.unshift(drawn);
  if (drawStatsHistory.length > 100) drawStatsHistory.pop();
  updateLiveStatistics();

  myActiveTickets.forEach(t => {
    let win = 0;
    const hits = t.picks.filter(n => drawn.includes(n)).length;

    if (t.serverRes && t.serverRes.payout !== undefined) {
      win = Number(t.serverRes.payout) || 0;
    } else {
      const multList = paytable[String(t.picks.length)] || [];
      const m = multList[hits] || 0;
      win = t.amount * m;
    }

    const st = $('status_' + t.id);
    if (win > 0) {
      totalWin += win;
      if (st) { st.textContent = `WON +${win.toFixed(0)} ETB`; st.className = 'status-won'; }
    } else if (st) {
      st.textContent = 'Settled'; st.className = 'status-lost';
    }

    fullHistory.unshift({
      roundId: t.roundId,
      picks: t.picks,
      amount: t.amount,
      hits: hits,
      win: win,
      status: win > 0 ? 'WON' : 'LOST',
      time: Date.now()
    });
  });

  // Evaluate other players
  dynamicLiveTickets.forEach(t => {
    const hits = t.picks.filter(n => drawn.includes(n)).length;
    const multList = paytable[String(t.picks.length)] || [];
    const win = t.amount * (multList[hits] || 0);
    const dst = $('dstatus_' + t.id);
    if (win > 0 && dst) { dst.textContent = `WON +${win.toFixed(0)} ETB`; dst.className = 'status-won'; }
    else if (dst) { dst.textContent = 'Settled'; dst.className = 'status-lost'; }
  });

  // REVEAL WINNING BALANCE: Only now does the win reflect on screen!
  shownBalance = serverBalance;
  showBalance(true);

  if (totalWin > 0) {
    playSynth(880, .25, 'triangle');
    showToast(`won ${totalWin.toFixed(0)}`, 'success');
    $('draw-result').innerHTML = `<span class="res-win">WIN +${totalWin.toFixed(0)} ETB</span>`;
  } else if (myActiveTickets.length > 0) {
    $('draw-result').innerHTML = `<span class="res-lose">No win this round</span>`;
  }

  addResultRecord(roundId, drawn);
  renderHistoryView();
  postParent({ type: 'BET_ENDED' });
  refreshBalance();
}

// ---------------- Real Live Statistics Calculation ----------------
function updateLiveStatistics() {
  const counts = {}; for (let i = 1; i <= 80; i++) counts[i] = 0;
  drawStatsHistory.forEach(dr => dr.forEach(n => { if (counts[n] !== undefined) counts[n]++; }));

  const sorted = Object.keys(counts).map(Number).sort((a, b) => counts[b] - counts[a]);
  hotSet = new Set(sorted.slice(0, 5));
  coldSet = new Set(sorted.slice(-5));

  const maxC = Math.max(...Object.values(counts), 1);
  const container = $('stats-bars-container');
  if (container) {
    container.innerHTML = sorted.map(num => `
      <div class="stat-row">
        <div class="stat-num">${num}</div>
        <div class="stat-bar-outer"><div class="stat-bar-fill" style="width:${Math.round(counts[num] / maxC * 100)}%;"></div></div>
        <div class="stat-count">${counts[num]}</div>
      </div>
    `).join('');
  }
  updateGridDots();
}

function switchModalTab(tab) {
  $('modal-nav-rules').classList.toggle('active', tab === 'rules');
  $('modal-nav-paytable').classList.toggle('active', tab === 'paytable');
  const c = $('modal-content');
  if (tab === 'rules') {
    c.innerHTML = `
      <h4 style="color:#fff;margin-bottom:4px;">How to play</h4>
      <p style="margin-bottom:8px;">Choose 1 to 10 numbers from 1 to 80. Each round runs on an 80-second continuous cycle (60s betting + 20s draw). 20 numbers are drawn by certified server RNG.</p>
      <h4 style="color:#fff;margin-bottom:4px;">Limits</h4>
      <p style="margin-bottom:8px;">Bet ${MIN_BET} – ${MAX_BET} ETB. Maximum payout per bet ${MAX_PAYOUT.toLocaleString()} ETB.</p>
    `;
  } else {
    let t = '<table class="paytable-grid-table"><thead><tr><th>Hits</th>' + Array.from({ length: 10 }, (_, i) => `<th>${i + 1}</th>`).join('') + '</tr></thead><tbody>';
    for (let h = 0; h <= 10; h++) {
      t += `<tr><td style="font-weight:bold;color:#fff">${h}</td>`;
      for (let p = 1; p <= 10; p++) {
        const m = (paytable[String(p)] || [])[h];
        t += `<td>${m !== undefined && m > 0 ? m + 'x' : '-'}</td>`;
      }
      t += '</tr>';
    }
    t += '</tbody></table>';
    c.innerHTML = t;
  }
}

document.addEventListener('pointerdown', () => {
  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}, { once: true });

window.addEventListener('DOMContentLoaded', () => {
  const { roundId } = getGlobalRound();
  dynamicAllCount = computeBaseRoundBets(roundId);
  $('lbl-all-count').textContent = dynamicAllCount.toLocaleString();

  // Seed base history for initial live statistics
  for (let r = 0; r < 20; r++) {
    const p = Array.from({ length: 80 }, (_, i) => i + 1).sort(() => Math.random() - .5).slice(0, 20);
    drawStatsHistory.push(p);
  }

  buildGrid();
  setBet(4);
  updateLiveStatistics();
  initPlayerFeed();
  renderHistoryView();
  loadPublicLeaders();
});
</script>
